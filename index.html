<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue Integrity · Shipping Cloud</title>

<style>
:root{
  --bg:#F7F6F4;--surface:#FFFFFF;--ink:#2A2A28;--ink2:#5A5955;--muted:#9B9A96;--line:#E4E3DF;--line2:#F0EFED;--black:#141414;
  --under:#FF4405;--over:#088AB2;--under-ink:#C23300;--over-ink:#066A89;--good:#16A34A;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/20px var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.chrome{position:sticky;top:0;z-index:20}
.top{background:var(--black);color:#fff}
.wrap{max-width:1360px;margin:0 auto;padding:0 48px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand svg{height:22px;width:auto;display:block;color:#fff;flex:none}
.brand .sep{width:1px;height:24px;background:rgba(255,255,255,.16);flex:none}
.brand .app{font:400 26px/28px var(--serif);letter-spacing:-.01em;white-space:nowrap}
.brand .scope{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.fresh{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--muted);text-align:right}
.fresh b{color:#fff;font-weight:500}
.icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:2px;background:var(--black)}
.prog i{display:block;height:2px;width:0;background:var(--under);transition:width .4s}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:32px}
.tabs button{padding:16px 0 14px;border-bottom:2px solid transparent;font-weight:500;color:var(--ink2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--under)}
.bar{background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;padding-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px}
.seg button{padding:4px 12px;border-radius:6px;font-size:12px;line-height:20px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.vsep{width:1px;height:24px;background:var(--line);margin:0 8px}
.dd{padding:4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px;line-height:20px;font-weight:500;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}
.dd:hover{border-color:var(--muted)}
.dd.on{border-color:var(--ink);color:var(--ink)}
.dd b{background:var(--ink);color:#fff;border-radius:8px;padding:0 6px;font-size:11px;line-height:16px}
.dd .car{font-size:9px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:2px 4px 2px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12px;line-height:20px}
.chip em{font-style:normal;color:var(--muted)}
.chip button{width:20px;height:20px;border-radius:10px;color:var(--muted)}
.chip button:hover{background:var(--line2);color:var(--ink)}
.linkbtn{font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
main.wrap{padding-top:24px;padding-bottom:64px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.own{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.mt{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.card h2{font:400 24px/32px var(--serif);margin:0;letter-spacing:-.005em}
.card h3{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.sub{font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.kpi .lbl{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.kpi .val{font:400 44px/48px var(--serif);letter-spacing:-.01em;margin-top:8px;white-space:nowrap}
.kpi .meta{font-size:12px;line-height:16px;color:var(--muted);margin-top:8px}
.kpi .delta{font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.u{background:var(--under)}.dot.o{background:var(--over)}.dot.k{background:var(--ink)}.dot.g{background:var(--muted)}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink2)}
.legend button,.legend span{display:inline-flex;gap:8px;align-items:center}
.legend .off{opacity:.35}
.tabs2{display:flex;flex-wrap:wrap;gap:4px}
.tabs2 button{padding:4px 12px;border-radius:16px;font-size:12px;line-height:20px;font-weight:500;color:var(--ink2);border:1px solid transparent}
.tabs2 button.on{border-color:var(--ink);color:var(--ink)}
.slot{width:100%;position:relative}
svg.chart{display:block;overflow:visible}
svg.chart text{font:11px var(--sans);fill:var(--muted)}
svg.chart .grid{stroke:var(--line2);stroke-width:1}
svg.chart .zero{stroke:var(--line);stroke-width:1}
svg.chart .hit{fill:transparent;cursor:pointer}
svg.chart .hit:hover{fill:rgba(13,13,13,.04)}
svg.chart .nohit{cursor:default}
.drows .hd{display:grid;grid-template-columns:minmax(140px,30%) 1fr 72px;gap:16px;padding:0 8px 8px;font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drows .hd .mid{display:grid;grid-template-columns:1fr 1fr}
.drows .hd .mid span:first-child{text-align:right;padding-right:8px}
.drows .hd .mid span:last-child{padding-left:8px}
.drow{display:grid;grid-template-columns:minmax(140px,30%) 1fr 72px;align-items:center;gap:16px;padding:8px;border-top:1px solid var(--line2);cursor:pointer;border-radius:4px}
.drow:hover{background:var(--line2)}
.drow.sel{background:var(--line2);box-shadow:inset 2px 0 0 var(--ink)}
.drow.on .nm{font-weight:700}
.drow .nm{font-weight:500;font-size:13px;line-height:18px;min-width:0}
.drow .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbar{display:grid;grid-template-columns:1fr 1fr;align-items:center;height:24px}
.dbar .l{display:flex;flex-direction:row-reverse;align-items:center;gap:8px;height:100%;border-right:1px solid var(--line)}
.dbar .r{display:flex;align-items:center;gap:8px;height:100%}
.dbar i{display:block;height:12px;flex:none}
.dbar .l i{background:var(--under);border-radius:4px 0 0 4px}
.dbar .r i{background:var(--over);border-radius:0 4px 4px 0}
.dbar span{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dbar.one{grid-template-columns:1fr}
.dbar.one .l{flex-direction:row;border-right:0;border-left:1px solid var(--line)}
.dbar.one .l i{border-radius:0 4px 4px 0}
.drows.one .drow,.drows.one .hd{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 56px}
.drows.one .hd .mid{grid-template-columns:1fr}
.drow .cnt{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.more{margin-top:8px;padding:8px;font-size:12px;font-weight:500;color:var(--ink2)}
.more:hover{color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
.t th{font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
.t td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--line2)}
.t small{display:block;color:var(--muted);font-size:11px;line-height:16px}
.t code{font:500 12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.pill.u{background:rgba(255,68,5,.1);color:var(--under-ink)}
.pill.o{background:rgba(8,138,178,.1);color:var(--over-ink)}
.pill.g{background:rgba(155,154,150,.14);color:var(--ink2)}
.pill.ok{background:rgba(22,163,74,.1);color:var(--good)}
.pill.k{background:var(--ink);color:#fff}
.scroll{overflow:auto;max-height:560px}
.empty{padding:32px 0;text-align:center;color:var(--muted);font-size:13px}
.loading{padding:24px 0;color:var(--muted);font-size:13px}
.skel{height:120px;border-radius:8px;background:linear-gradient(90deg,var(--line2),#fff,var(--line2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.hero-msg{max-width:640px;margin:64px auto;text-align:center}
.hero-msg h1{font:400 40px/48px var(--serif);margin:0 0 16px}
.hero-msg p{color:var(--ink2);margin:0 0 24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;font-weight:600}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.banner{background:rgba(255,68,5,.08);border:1px solid rgba(255,68,5,.24);color:var(--under-ink);border-radius:8px;padding:8px 16px;font-size:13px;margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}
#scrim{position:fixed;inset:0;background:rgba(13,13,13,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(800px,100vw);background:var(--bg);transform:translateX(105%);transition:transform .25s ease;z-index:41;overflow:auto;box-shadow:-8px 0 32px rgba(0,0,0,.16)}
#drawer.on{transform:none}
.dw-h{background:var(--black);color:#fff;padding:24px 32px;position:sticky;top:0;z-index:2}
.dw-h .eyebrow{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dw-h h1{font:400 32px/40px var(--serif);margin:4px 48px 8px 0}
.dw-h .x{position:absolute;right:24px;top:24px}
.owners{display:flex;flex-wrap:wrap;gap:8px}
.owners span{font-size:12px;line-height:20px;padding:2px 12px;border-radius:16px;background:rgba(255,255,255,.08);color:#fff}
.owners span em{font-style:normal;color:var(--muted);margin-right:4px}
.dw-b{padding:24px 32px 48px;display:grid;gap:16px}
.dw-b .card{padding:16px 24px}
.dw-b .kpi .val{font-size:32px;line-height:40px}
.fix{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center}
.fix input,.fix textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;background:#fff;width:100%}
.fix textarea{grid-column:1/-1;min-height:56px;resize:vertical}
.fix .meta{grid-column:1/-1;font-size:12px;color:var(--muted)}
.hint{font-size:12px;line-height:16px;color:var(--ink2);margin-top:2px}
#pop{position:fixed;display:none;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.12);width:340px;max-height:440px;flex-direction:column}
#pop.on{display:flex}
#pop input{margin:8px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;outline:none}
#pop input:focus{border-color:var(--ink)}
#pop .opts{overflow:auto;flex:1}
#pop .opt{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 12px;font-size:13px;line-height:18px;cursor:pointer}
#pop .opt:hover{background:var(--line2)}
#pop .opt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pop .opt .v{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#pop .cb{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px}
#pop .cb.on{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px #fff}
#pop .pf{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line2)}
#tip{position:fixed;pointer-events:none;background:var(--black);color:#fff;font-size:12px;line-height:16px;padding:8px 12px;border-radius:6px;opacity:0;transition:opacity .08s;z-index:60;max-width:300px}
#tip.on{opacity:1}
#tip .tt{font-weight:600;margin-bottom:4px}
#tip .r{display:flex;justify-content:space-between;gap:16px;align-items:center}
#tip .r span{display:inline-flex;gap:8px;align-items:center;color:#C8C7C2}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--black);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:all .2s;z-index:70;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.own,.half{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.wrap{padding:0 16px}.brand .scope,.brand .sep{display:none}.kpis,.k3{grid-template-columns:minmax(0,1fr)}.kpi .val{font-size:36px;line-height:40px}.tabs .wrap{gap:24px}.dw-h,.dw-b{padding-left:16px;padding-right:16px}.drow,.drows .hd,.drows.one .drow,.drows.one .hd{grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:8px}.drow .cnt,.drows .hd>span:last-child{display:none}#fresh{display:none}.brand .app{font-size:22px}.card{padding:16px}.t{font-size:12px}}
</style>
</head>

<script type="module">
/* Revenue Integrity: catches, diagnoses and tracks fixes for Shipping Cloud label revenue issues.
   Live data comes from Snowflake through the Fridge runtime SDK. Fridge rejects SQL that contains
   comments or semicolons, so all SQL below is single-statement and comment-free. */

const STORE_KEY = 'shipping-rev-rec';
const DATA_VERSION = 1;
const CACHE_PATH = 'cache/data-v1.json';
const LS_KEY = 'rri:data:v1';
const STALE_MS = 4 * 3600e3;
const EPOCH = '2025-01-01';
const EPOCH_MS = Date.UTC(2025, 0, 1);
const CHUNKS = 4;
const T = {
  DIAG: 'KITCHEN.REVENUE.OMS_LABEL_BILLING_DIAGNOSTICS_CURRENT',
  SHIP: 'KITCHEN.REVENUE.OUTBOUND_LABELS_REVENUE_BY_SHIPMENT_CURRENT',
  ADJ: 'KITCHEN.REVENUE.OUTBOUND_LABEL_REVENUE_ADJUSTMENTS',
  TRBH: 'KITCHEN.REVENUE.TOTAL_REVENUE_BY_HOUR',
  MR: ['KITCHEN.FINANCE.MONTHLY_REPORT_V2', 'KITCHEN.PANTRY.INGR_MONTHLY_REPORT_V2'],
  TEAMS: 'KITCHEN.REV_OPS.TEAMS',
  HSC: 'KITCHEN.REV_OPS.HUBSPOT_COMPANIES',
  HSD: 'KITCHEN.REV_OPS.HUBSPOT_DEALS',
};

// Issue types. Codes match the CASE expression in SQL_TYPE (8, positive "other", folds into 4).
const TYPES = [
  { code: 2, dir: -1, name: 'Carrier billed above quote', why: 'Carrier invoice came in above our quote; the gap was not passed on.', fix: 'Re-bill the surcharge to the merchant or dispute it with the carrier.' },
  { code: 3, dir: -1, name: 'Merchant under-billed', why: 'Merchant was charged less than expected (refund or partial charge).', fix: 'Collect the shortfall and check the refund.' },
  { code: 9, dir: -1, name: 'Carrier billed extra label', why: 'Carrier billed a label we never quoted (extra piece or voided label).', fix: 'Dispute with the carrier or bill the merchant for the extra piece.' },

    <div class="grid k3">${kpi('Under-billed', 'u', money(t.u), `${cnt(t.un)} shipments`)}${kpi('Over-billed', 'o', money(t.o), `${cnt(t.on)} shipments`)}${kpi('Not yet counted', 'g', money(M.pend[m] + M.rvw[m]), `${cnt(M.pendN[m])} in window · ${cnt(M.rvwN[m])} in review`)}</div>
    <div class="card"><h3>Fix status</h3><div class="fix"><div class="seg">${statusBtns}</div><input data-form="owner" placeholder="Owner" value="${esc(form.owner)}"><span></span><button class="btn" data-save>Save</button>
      <textarea data-form="note" placeholder="What's the fix? e.g. Re-billing UPS corrections for September">${esc(form.note)}</textarea>
      <div class="meta">${act.updatedAt ? `Last updated ${esc(act.updatedAt.slice(0, 10))} by ${esc(act.updatedBy || 'unknown')}` : 'Not tracked yet.'}</div></div></div>
    <div class="card"><div class="card-h"><div><h2>By month</h2></div>${legendUO(false)}</div>${slot('d-trend', 180, (w, hh) => colChart(pts, w, hh, { show: S.show }))}</div>
    <div class="card"><h2>What went wrong</h2><div class="sub" style="margin-bottom:8px">Each issue type with the fix.</div>${drows(mix, {})}</div>
    <div class="card"><h2>What carriers added</h2><div class="sub" style="margin-bottom:8px">Carrier charges behind this merchant's under-billing.</div>${reasons}</div>
    <div class="card"><div class="card-h"><div><h2>Shipments to fix</h2></div>${Array.isArray(dw.ships) && dw.ships.length ? '<button class="btn ghost" data-export="ships">Export CSV</button>' : ''}</div>${ships}</div>
  </div>`;
  drawSlots($('#drawer'));
  if (keepScroll) $('#drawer').scrollTop = saved;
}
async function saveFix() {
  const dw = S.drawer; if (!dw) return;
  const D = S.data, id = D.M.id[dw.m];
  const val = { ...(S.actions.get(id) || {}), status: dw.form.status, owner: dw.form.owner.trim(), note: dw.form.note.trim(), name: D.M.name[dw.m], updatedAt: new Date().toISOString(), updatedBy: me?.name || me?.email || 'Unknown', openAtUpdate: round2(curU(dw.m)) };
  const btn = $('[data-save]'); if (btn) btn.disabled = true;
  try { await colSet('actions', id, val); S.actions.set(id, val); toast('Saved'); renderDrawer(true); if (S.tab !== 'issues') renderView(); }
  catch (e) { toast('Could not save: ' + msg(e)); if (btn) btn.disabled = false; }
}

/* ---------------- filter popover ---------------- */
function openPop(dim, anchor) {
  const pop = $('#pop');
  S.pop = { dim, q: '' };
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - 348)) + 'px';
  pop.style.top = r.bottom + 8 + 'px';
  pop.innerHTML = `<input type="search" placeholder="Search ${esc(DIM_LABEL[dim].toLowerCase())}" data-popq><div class="opts"></div><div class="pf"><button class="linkbtn" data-popclear>Clear</button><button class="linkbtn" data-popdone>Done</button></div>`;
  pop.classList.add('on');
  renderPopOpts();
  $('[data-popq]', pop).focus();
}
function closePop() { S.pop = null; $('#pop').classList.remove('on'); }
function renderPopOpts() {
  if (!S.pop) return;
  const { dim, q } = S.pop, sel = S.f[dim];
  const a = agg({ by: dim, excl: dim });
  let items = [...a.groups].map(([k, g]) => ({ k, name: dimName(dim, k), u: g.u, o: g.o }));
  for (const k of sel) if (!a.groups.has(k)) items.push({ k, name: dimName(dim, k), u: 0, o: 0 });
  if (q) items = items.filter((x) => String(x.name).toLowerCase().includes(q));
  items.sort((x, y) => (sel.has(y.k) - sel.has(x.k)) || Math.abs(y.u) + y.o - (Math.abs(x.u) + x.o));
  const more = items.length - 200;
  items = items.slice(0, 200);
  $('#pop .opts').innerHTML = items.map((x) => `<div class="opt" data-opt="${x.k}"><span class="cb${sel.has(x.k) ? ' on' : ''}"></span><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span><span class="v">${x.u < 0 ? money(x.u) + ' under' : ''}${x.u < 0 && x.o > 0 ? ' · ' : ''}${x.o > 0 ? money(x.o) + ' over' : ''}</span></div>`).join('') + (more > 0 ? `<div class="opt"><span></span><span class="note">${cnt(more)} more. Search to narrow.</span></div>` : '') || '<div class="empty">No matches.</div>';
}

/* ---------------- CSV ---------------- */
function download(name, rows) {
  const csv = rows.map((r) => r.map((c) => { const s = String(c ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------- events ---------------- */
function applyChange() { savePrefs(); renderBar(); renderView(); if (S.pop) renderPopOpts(); }
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-tab],[data-preset],[data-grain],[data-dd],[data-opt],[data-popclear],[data-popdone],[data-clear],[data-rm],[data-drill],[data-act],[data-legend],[data-bdim],[data-ball],[data-okind],[data-close],[data-status],[data-save],[data-export],[data-retry],#refresh,#scrim');
  if (S.pop && !e.target.closest('#pop') && !e.target.closest('[data-dd]')) closePop();
  if (!el) return;
  const ds = el.dataset;
  if (ds.tab) { S.tab = ds.tab; closePop(); savePrefs(); render(); window.scrollTo(0, 0); }
  else if (ds.preset) { S.range = { preset: ds.preset }; applyChange(); }
  else if (ds.grain) { S.grain = ds.grain; applyChange(); }
  else if (ds.dd) { if (S.pop?.dim === ds.dd) closePop(); else openPop(ds.dd, el); }
  else if (ds.opt != null && S.pop) { const k = +ds.opt, set = S.f[S.pop.dim]; set.has(k) ? set.delete(k) : set.add(k); applyChange(); }
  else if ('popclear' in ds && S.pop) { S.f[S.pop.dim].clear(); applyChange(); }
  else if ('popdone' in ds) closePop();
  else if ('clear' in ds) { for (const s of Object.values(S.f)) s.clear(); if (S.range.from != null) S.range = { preset: 'all' }; applyChange(); }
  else if (ds.rm) { if (ds.rm === 'range') S.range = { preset: 'all' }; else { const [dim, k] = ds.rm.split(':'); S.f[dim].delete(+k); } applyChange(); }
  else if (ds.drill) {
    const [id, i] = ds.drill.split(':'), d = DRILL[id]?.[+i]; if (!d) return;
    S.range = { from: pStart(d.k, d.g), to: pEnd(d.k, d.g), label: pLabel(d.k, d.g, true) };
    S.grain = FINER[d.g]; hideTip(); applyChange();
  }
  else if (ds.act) {
    const key = ds.key;
    if (ds.act === 'merchant') openMerchant(+key);
    else if (ds.act === 'owner') { S.ownerSel[S.ownerKind] = +key; renderView(); }
    else if (ds.act.startsWith('filter:')) { const dim = ds.act.slice(7), set = S.f[dim], k = +key; set.has(k) ? set.delete(k) : set.add(k); applyChange(); }
  }
  else if (ds.legend) { const k = ds.legend; S.show[k] = !S.show[k]; if (!S.show.u && !S.show.o) S.show[k === 'u' ? 'o' : 'u'] = true; renderView(); if (S.drawer) renderDrawer(true); }
  else if (ds.bdim) { S.bdim = ds.bdim; S.bAll = false; renderView(); }
  else if ('ball' in ds) { S.bAll = !S.bAll; renderView(); }
  else if (ds.okind) { S.ownerKind = ds.okind; renderView(); }
  else if ('close' in ds || el.id === 'scrim') closeDrawer();
  else if (ds.status && S.drawer) { S.drawer.form.status = ds.status; document.querySelectorAll('[data-status]').forEach((b) => b.classList.toggle('on', b.dataset.status === ds.status)); }
  else if ('save' in ds) saveFix();
  else if ('retry' in ds) { S.error = null; renderView(); refresh(); }
  else if (el.id === 'refresh') refresh();
  else if (ds.export === 'recon') download(`label-revenue-vs-monthly-report-${S.grain}.csv`, [['period', 'monthly_report', 'label_view', 'gap', 'gap_pct', 'labels'], ...reconRows().map((r) => [r.long, r.mr.toFixed(2), r.lbl.toFixed(2), r.gap.toFixed(2), r.pct == null ? '' : (r.pct * 100).toFixed(2), r.labels])]);
  else if (ds.export === 'ships' && S.drawer) {
    const D = S.data, name = D.M.name[S.drawer.m];
    download(`${name.replace(/[^A-Za-z0-9]+/g, '-').toLowerCase()}-shipments.csv`, [['fulfillment_group', 'tracking', 'carrier', 'labels', 'bought', 'issue_date', 'issue_type', 'gap', 'merchant_billed', 'merchant_expected', 'carrier_cost', 'carrier_quote'],
      ...S.drawer.ships.map((r) => { const md = +r.billed - +r.ec, xd = +r.chg - md; return [r.fg, r.trk, r.car, r.trks, r.bought, r.issued, TYPE_BY[classify(r)]?.name, (+r.v).toFixed(2), (+r.billed).toFixed(2), (+r.ec).toFixed(2), (+r.ecc - xd).toFixed(2), (+r.ecc).toFixed(2)]; })]);
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-popq]') && S.pop) { S.pop.q = e.target.value.trim().toLowerCase(); renderPopOpts(); }
  else if (e.target.dataset.form && S.drawer?.form) S.drawer.form[e.target.dataset.form] = e.target.value;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.pop) closePop(); else if (S.drawer) closeDrawer(); } });
const tip = $('#tip');
function hideTip() { tip.classList.remove('on'); }
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) return hideTip();
  const [id, i] = t.dataset.tip.split(':'), html = TIPS[id]?.[+i];
  if (!html) return hideTip();
  if (tip.dataset.k !== t.dataset.tip) { tip.innerHTML = html; tip.dataset.k = t.dataset.tip; }
  tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 16, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 16;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawSlots(); }, 150); });
setInterval(() => { renderFresh(); if (S.data && !S.loading && Date.now() - S.data.fetchedAt > STALE_MS && document.visibilityState === 'visible') refresh(); }, 60000);

/* Brand fonts: assets/fonts.css ships with git deploys and Google Fonts is linked as a second source.
   If neither loaded Instrument Serif, pull the same fonts.css from the data store. */
async function ensureFonts() {
  try {
    await document.fonts.ready;
    await new Promise((r) => setTimeout(r, 2500));
    if ([...document.fonts].some((f) => f.family.replace(/["']/g, '') === 'Instrument Serif' && f.status === 'loaded')) return;
    const css = await withStore((h) => h.files.text('assets/fonts.css'));
    if (css && css.includes('@font-face')) { const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st); }
  } catch {}
}

/* ---------------- boot ---------------- */
(async function boot() {
  render();
  try { await initSdk(); }
  catch (e) { S.error = 'This page needs the Fridge runtime. Open it from its fridge.redo.builders address. (' + msg(e) + ')'; renderView(); renderFresh(); return; }
  loadSide();
  ensureFonts();
  let raw = readLocal();
  const remote = await readRemote();
  if (remote && (!raw || remote.fetchedAt > raw.fetchedAt)) raw = remote;
  if (raw) setRaw(raw, 'cache');
  if (!raw || Date.now() - raw.fetchedAt > STALE_MS) await refresh();
})();
</script>
