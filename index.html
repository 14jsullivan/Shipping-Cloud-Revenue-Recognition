<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue Integrity · Shipping Cloud</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23141414%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%23FF4405%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F6F4;--surface:#FFFFFF;--ink:#2A2A28;--ink2:#5A5955;--muted:#9B9A96;--line:#E4E3DF;--line2:#F0EFED;--black:#141414;
  --under:#FF4405;--over:#088AB2;--under-ink:#C23300;--over-ink:#066A89;--good:#16A34A;--pend:#C4C2BC;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/20px var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.chrome{position:sticky;top:0;z-index:20}
.top{background:var(--black);color:#fff}
.wrap{max-width:1360px;margin:0 auto;padding:0 48px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand svg{height:22px;width:auto;display:block;color:#fff;flex:none}
.brand .sep{width:1px;height:24px;background:rgba(255,255,255,.16);flex:none}
.brand .app{font:400 26px/28px var(--serif);letter-spacing:-.01em;white-space:nowrap}
.brand .scope{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.fresh{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--muted);text-align:right}
.fresh b{color:#fff;font-weight:500}
.icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:2px;background:var(--black)}
.prog i{display:block;height:2px;width:0;background:var(--under);transition:width .4s}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:32px}
.tabs button{padding:16px 0 14px;border-bottom:2px solid transparent;font-weight:500;color:var(--ink2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--under)}
.bar{background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;padding-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px}
.seg button{padding:4px 12px;border-radius:6px;font-size:12px;line-height:20px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.vsep{width:1px;height:24px;background:var(--line);margin:0 8px}
.dd{padding:4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px;line-height:20px;font-weight:500;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}
.dd:hover{border-color:var(--muted)}
.dd.on{border-color:var(--ink);color:var(--ink)}
.dd b{background:var(--ink);color:#fff;border-radius:8px;padding:0 6px;font-size:11px;line-height:16px}
.dd .car{font-size:9px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:2px 4px 2px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12px;line-height:20px}
.chip em{font-style:normal;color:var(--muted)}
.chip button{width:20px;height:20px;border-radius:10px;color:var(--muted)}
.chip button:hover{background:var(--line2);color:var(--ink)}
.linkbtn{font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
main.wrap{padding-top:24px;padding-bottom:64px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.own{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.mt{margin-top:16px}
.kpi.pick{cursor:pointer;transition:box-shadow .1s}
.kpi.pick:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.kpi.pick.on{box-shadow:inset 0 0 0 2px var(--ink)}
.hl{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:center;border-left:4px solid var(--under)}
.hl.o{border-left-color:var(--over)}
.hl .eyebrow{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.hl h2{font:400 32px/40px var(--serif);margin:4px 0 8px;letter-spacing:-.01em}
.hl h2 .muted{color:var(--muted)}
.hl-sub{font-size:13px;color:var(--ink2)}
.fixline{font-size:13px;color:var(--ink2);margin-top:4px}
.fixline b{font-weight:600;color:var(--ink);margin-right:4px}
.lnk{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:12px}
.crumb{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 12px;border-radius:16px;background:var(--line2);color:var(--ink);font-weight:500;line-height:20px}
.crumb:first-child{padding-right:12px}
.crumb button{width:20px;height:20px;border-radius:10px;color:var(--muted)}
.crumb button:hover{background:#fff;color:var(--ink)}
.sepr{color:var(--muted)}
.hl-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hl-facts span{display:block;font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hl-facts b{display:block;font:400 32px/40px var(--serif);font-weight:400;white-space:nowrap}
.mx-wrap{overflow-x:auto;margin:0 -8px}
table.mx{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px;min-width:720px}
.mx th{font:600 12px/16px var(--sans);color:var(--ink);text-align:left;padding:8px;cursor:pointer;border-radius:6px;vertical-align:bottom}
.mx th small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.mx thead th{text-align:center;min-width:104px}
.mx th.corner{cursor:default;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mx tbody th{white-space:nowrap}
.mx th:hover,.mx td[data-dx-cell]:hover,.mx td.tot:hover{box-shadow:inset 0 0 0 1px var(--ink2)}
.mx td{text-align:center;padding:12px 8px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap}
.mx td.nil{color:var(--muted);background:var(--bg);cursor:default}
.mx .tot{background:var(--bg);font-weight:600}
.mx .on{box-shadow:inset 0 0 0 2px var(--ink)!important}
.mx td.best{font-weight:700}
.hb{display:inline-block;width:120px;height:8px;border-radius:4px;background:var(--line2);vertical-align:middle;margin-right:8px;overflow:hidden}
.hb i{display:block;height:8px;border-radius:4px}
.barcell{white-space:nowrap}
.barcell b{font-weight:600;font-variant-numeric:tabular-nums}
.t tr.sel td{background:var(--line2)}
.t tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--ink)}
.t .nm{font-weight:600}
.reps td{vertical-align:middle}
.dirseg button{display:inline-flex;align-items:center;gap:6px}
.dirseg button.on .dot{box-shadow:0 0 0 2px #fff}
.wf-r.click{cursor:pointer;border-radius:4px}
.wf-r.click:hover{background:var(--line2)}
.wf-r.click .nm span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.btn.sm{padding:4px 12px;font-size:12px}
.muted{color:var(--muted)}
.aib{display:inline-block;font:700 10px/16px var(--sans);letter-spacing:.06em;padding:0 6px;border-radius:4px;background:var(--ink);color:#fff;margin-right:8px;vertical-align:1px}
.brief .eyebrow{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.bl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.bl li{padding:8px 12px;border-left:3px solid var(--under);background:var(--bg);border-radius:0 6px 6px 0;font-size:14px;line-height:20px}
.bl li.o{border-left-color:var(--over)}
.tops{display:grid}
.pld{display:grid;gap:18px}
.pf{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:start}
.pl{font:600 11px/32px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.pdates{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink2)}
.pdates input,.chk input[type=number]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.chk input[type=number]{width:80px;margin-left:6px;line-height:20px;height:32px;box-sizing:border-box}
.chk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;line-height:32px;color:var(--ink)}
.chk small{flex-basis:100%;margin:-8px 0 0 22px;font-size:12px;line-height:16px;color:var(--muted)}
.pgo{display:flex;align-items:center;gap:16px;padding-top:4px;border-top:1px solid var(--line2)}
.pgo .btn{margin-top:14px}
.pmsg{margin-top:14px;font-size:13px;color:var(--ink2)}
.pmsg.err{color:var(--under-ink)}
.plist{margin:0;padding-left:18px;font-size:14px;line-height:21px;color:var(--ink)}
.plist li+li{margin-top:6px}
.plist b{font-weight:600}
.pldbtn{margin-left:auto}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.st{padding:16px;border-radius:8px;background:var(--bg);border-left:4px solid var(--under)}
.st.o{border-left-color:var(--over)}
.st span{display:block;font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.st b{display:block;font:400 36px/44px var(--serif);margin-top:4px}
.st.u b{color:var(--under-ink)}
.st.o b{color:var(--over-ink)}
.st small{display:block;font-size:12px;color:var(--muted)}
.ws{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:24px 0 8px}
.st small.pn{color:var(--ink2);margin-top:2px}
.pendnote{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;margin-top:16px;padding:12px 16px;border-radius:8px;background:var(--bg);font-size:13px;line-height:20px;color:var(--ink2)}
.pendnote p{margin:0}
.pendnote b{font-weight:600;color:var(--ink)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-top:4px;background:var(--under)}
.sw.o{background:var(--over)}
.sw.pend{background:var(--pend)}
.brk{border-left:4px solid var(--under)}
.brk.o{border-left-color:var(--over)}
.brk.pend{border-left-color:var(--pend)}
.brk .eyebrow{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.brk .big{font:400 22px/30px var(--serif);color:var(--ink);margin:6px 0 0;max-width:860px}
.brk .fx{margin:10px 0 0;font-size:14px;line-height:20px;color:var(--ink);display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.brk .fx b{font:600 11px/20px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lf{margin-top:20px;display:grid;gap:4px}
.lf-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line2);margin-bottom:8px}
.lf-bar i{display:block;height:14px}
.lf-bar i.u{background:var(--under)}
.lf-bar i.pend{background:var(--pend)}
.lf-bar i.o{background:var(--over)}
.lf-r,.lf-h{display:grid;grid-template-columns:12px minmax(0,1fr) 64px 96px;gap:12px;align-items:start;padding:8px;border-radius:6px}
.lf-r.on{background:var(--bg)}
.lf-r b{display:block;font-size:14px;font-weight:600}
.lf-r small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.lf-n,.lf-v{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.lf-v.u{color:var(--under-ink)}
.lf-v.o{color:var(--over-ink)}
.lf-v.pend{color:var(--ink2)}
.lf-h{padding:0 8px;font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lf-h span:nth-child(3),.lf-h span:nth-child(4){text-align:right}
.sr{display:grid;grid-template-columns:28px minmax(0,1fr) 140px;gap:16px;padding:16px 0;border-top:1px solid var(--line);align-items:start}
.sr:first-child{border-top:0;padding-top:0}
.sr .rk{width:28px;height:28px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font:400 17px/1 var(--serif);color:var(--ink)}
.sr .line{margin:2px 0 0;font-size:16px;line-height:24px;color:var(--ink)}
.sr .line b{font-weight:600}
.sr .amt.u{color:var(--under-ink)}
.sr .amt.o{color:var(--over-ink)}
.sr .cf{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--ink2);display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.sr .cf span{font:600 11px/20px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sr .tf{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.sr .tf .grow{flex:1}
.sr .tf .by{font-style:italic}
.sr .tf .live.u{color:var(--under-ink)}
.sr .tf .live.o{color:var(--over-ink)}
.sr .sa{padding-top:8px}
.tbar{display:block;height:6px;border-radius:3px;background:var(--line2);margin-top:6px;overflow:hidden}
.tbar i{display:block;height:6px;border-radius:3px;margin-left:auto}
.tbar i.u{background:var(--under)}
.tbar i.o{background:var(--over)}
.mtrs{display:grid;gap:12px;margin-top:12px}
.mtr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px;gap:16px;align-items:center}
.mtr .ml b{display:block;font-size:13px;font-weight:600}
.mtr .ml small{display:block;font-size:12px;color:var(--muted);line-height:16px}
.mb{display:block;height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.mb i{display:block;height:10px;border-radius:5px}
.mb i.u{background:var(--under)}
.mb i.o{background:var(--over)}
.mp{font:400 24px/28px var(--serif);text-align:right}
.sh{white-space:nowrap;font-variant-numeric:tabular-nums}
.sh .arw{color:var(--muted)}
.sh b{font-weight:600}
.sh b.bad{color:var(--under-ink)}
.t td.n.u{color:var(--under-ink);font-weight:600}
.t td.n.o{color:var(--over-ink);font-weight:600}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:14px;background:var(--ink);color:#fff;font:600 13px/1 var(--sans);margin-right:12px;vertical-align:4px}
.hdr-r{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.crumbs .grow{flex:1}
.lede{font-size:14px;line-height:20px;color:var(--ink);margin:0 0 12px}
.lede b{font-weight:600}
.nw{white-space:nowrap}
.cc-lg{display:none;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.cc-lg .dot+.dot,.cc-lg .dot.u,.cc-lg .dot.o{margin-left:8px}
.cc-lg span{color:var(--muted);margin-left:8px}
.s3{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:32px}
#bridge.minh{min-height:280px}
#where.minh{min-height:520px}
.t td.u{color:var(--under-ink)}
.t td.o{color:var(--over-ink)}
.t tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.t.piv thead th,.t.piv tfoot td{position:sticky;background:var(--surface);z-index:1}
.t.piv thead th{top:0}
.t.piv tfoot td{bottom:0}
table.mx.piv{min-width:0}
.mx.piv thead th{min-width:64px;text-align:right;cursor:default}
.mx.piv thead th.corner{text-align:left}
.mx.piv thead th:hover{box-shadow:none}
.mx.piv td{padding:10px 8px;text-align:right}
.wf-r{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr) 72px 64px;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line2);font-size:13px;line-height:18px}
.wf-r .nm{min-width:0}
.wf-r .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-r .trk{position:relative;height:20px}
.wf-r .trk i{position:absolute;top:4px;height:12px;border-radius:2px}
.wf-r .trk i.u{background:var(--under)}
.wf-r .trk i.o{background:var(--over)}
.wf-r .trk i.k{background:var(--ink)}
.wf-r .z{position:absolute;top:-7px;bottom:-7px;width:1px;background:var(--line)}
.wf-r .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.wf-r .amt.u{color:var(--under-ink)}
.wf-r .amt.o{color:var(--over-ink)}
.wf-r .cnt{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wf-r.wf-h{border-top:0;font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wf-r.wf-h .amt{color:var(--muted)}
.wf-r.wf-g{border-top:0;padding-top:12px;font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.wf-r.wf-g .amt{font-size:12px;letter-spacing:0;color:var(--ink2)}
.wf-r.tot{border-top:2px solid var(--ink);margin-top:4px;font-weight:600}
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ins button{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 16px;border-radius:8px;background:var(--bg);border:1px solid var(--line);min-width:0}
.ins button:hover{border-color:var(--muted)}
.ins button.on{border-color:var(--ink)}
.ins .lbl{font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ins .big{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.ins .big b{font:400 24px/28px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ins .big em{font:600 20px/28px var(--sans);font-style:normal;flex:none}
.ins em.u{color:var(--under-ink)}
.ins em.o{color:var(--over-ink)}
.ins .meta{font-size:12px;line-height:16px;color:var(--ink2)}
.cc-r{display:grid;grid-template-columns:minmax(0,26%) minmax(0,1fr) 80px 80px 72px;gap:16px;align-items:center;padding:8px;border-top:1px solid var(--line2);border-radius:4px}
.cc-r.click{cursor:pointer}
.cc-r.click:hover{background:var(--line2)}
.cc-r .nm{font-weight:500;font-size:13px;line-height:18px;min-width:0}
.cc-r .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-r .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-b{display:grid;grid-template-columns:minmax(0,1fr) 40px;column-gap:8px;row-gap:4px;align-items:center}
.cc-b .trk{display:block;height:8px}
.cc-b i{display:block;height:8px;border-radius:0 4px 4px 0}
.cc-b i.p{background:#CFCDC7}

/* Revenue Integrity: catches, diagnoses and tracks fixes for Shipping Cloud label revenue issues.
   Live data comes from Snowflake through the Fridge runtime SDK. Fridge rejects SQL that contains
   comments or semicolons, so all SQL below is single-statement and comment-free. */

const STORE_KEY = 'shipping-rev-rec';
const DATA_VERSION = 1;
const CACHE_PATH = 'cache/data-v1.json';
const LS_KEY = 'rri:data:v1';
const STALE_MS = 4 * 3600e3;
const EPOCH = '2025-01-01';
const EPOCH_MS = Date.UTC(2025, 0, 1);
const CHUNKS = 4;
const SF_TIMEOUT_MS = 60000; // Fridge rejects snowflake.query timeouts above 60s
const T = {
  DIAG: 'KITCHEN.REVENUE.OMS_LABEL_BILLING_DIAGNOSTICS_CURRENT',
  SHIP: 'KITCHEN.REVENUE.OUTBOUND_LABELS_REVENUE_BY_SHIPMENT_CURRENT',
  ADJ: 'KITCHEN.REVENUE.OUTBOUND_LABEL_REVENUE_ADJUSTMENTS',
  TRBH: 'KITCHEN.REVENUE.TOTAL_REVENUE_BY_HOUR',
  MR: ['KITCHEN.FINANCE.MONTHLY_REPORT_V2', 'KITCHEN.PANTRY.INGR_MONTHLY_REPORT_V2'],
  LABELS: 'KITCHEN.PANTRY.INGR_OUTBOUND_LABELS',
  INVOICE: 'KITCHEN.PANTRY.INGR_LABEL_INVOICE_DETAIL',
  ITEMS: 'KITCHEN.PANTRY.INGR_STG_ORDER_FULFILLMENT_LINE_ITEMS',
  TEAMS: 'KITCHEN.REV_OPS.TEAMS',
  HSC: 'KITCHEN.REV_OPS.HUBSPOT_COMPANIES',
  HSD: 'KITCHEN.REV_OPS.HUBSPOT_DEALS',
};

// Issue types. Codes match the CASE expression in SQL_TYPE (8, positive "other", folds into 4).
const TYPES = [
  { code: 2, dir: -1, name: 'Carrier billed above quote', why: 'Carrier invoice came in above our quote; the gap was not passed on.', fix: 'Re-bill the surcharge to the merchant or dispute it with the carrier.' },
  { code: 3, dir: -1, name: 'Merchant under-billed', why: 'Merchant was charged less than expected (refund or partial charge).', fix: 'Collect the shortfall and check the refund.' },
  { code: 9, dir: -1, name: 'Carrier billed extra label', why: 'Carrier billed a label we never quoted (extra piece or voided label).', fix: 'Dispute with the carrier or bill the merchant for the extra piece.' },
  { code: 1, dir: -1, name: 'Merchant not billed', why: 'Label was bought but the merchant was never charged.', fix: 'Charge the merchant for the label.' },
  { code: 5, dir: 1, name: 'Carrier billed below quote', why: 'Carrier invoice came in below our quote.', fix: 'Confirm the carrier credit; tune quotes if it repeats.' },
  { code: 6, dir: 1, name: 'Merchant over-billed', why: 'Merchant was charged more than expected, often twice.', fix: 'Refund the duplicate charge.' },
  { code: 4, dir: 0, name: 'Other', why: 'Small rounding or revenue-share differences.', fix: 'Review only if material.' },
];
const TYPE_BY = Object.fromEntries(TYPES.map((t) => [t.code, t]));
const CARRIERS = { USPS: 'USPS', UspsShip: 'USPS', DhlEcs: 'DHL eCommerce', FirstMile: 'FirstMile', UPSSurePost: 'UPS SurePost', UPS: 'UPS', FedEx: 'FedEx', FedExSmartPost: 'FedEx SmartPost', AmazonShipping: 'Amazon', CanadaPost: 'Canada Post', UniUni: 'UniUni', APC: 'APC', OnTracV3: 'OnTrac', Multiple: 'Multiple carriers', Unknown: 'Unknown' };

  { key: 'carrier', label: 'Carrier' }, { key: 'merchant', label: 'Merchant' }, { key: 'origin', label: 'Origin' },
  { key: 'dest', label: 'Destination' }, { key: 'type', label: 'Issue type' }, { key: 'pa', label: 'PA' }, { key: 'se', label: 'SE' },
];

const STATUS = { open: 'Open', working: 'In progress', fixed: 'Fixed' };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* ---------------- state ---------------- */

  f: { carrier: new Set(), merchant: new Set(), origin: new Set(), dest: new Set(), type: new Set(), pa: new Set(), se: new Set() },

/* FedEx charge names on carrier bills that Redo's surcharge billing job does not recognize (missing from the FedEx

const FEDEX_UNRECOGNIZED = ['Weight and Dimension Discrepancy', 'Dimension Discrepancy', 'Weight Discrepancy', 'Credit - Weight and Dimension Discrepancy', 'Credit - Dimension Discrepancy', 'Credit - Weight Discrepancy', 'Unitemized Adjustment', 'Insurance'];

const sqlPldCount = (sc, dir, min) => `select count(*) n from ${T.DIAG} where diagnostic_status = 'issue' and diagnostic_variance_usd ${dir === 'u' ? '<' : '>'} 0${sc.where}${min > 0 ? ` and abs(diagnostic_variance_usd) >= ${+min}` : ''}`;

const sqlPassOn = ({ comp, cu, passed, car, unrec, topsub, lastc }) => `case when coalesce(${cu}, 0) < 0.005 then 'nocharge' when ${passed} >= ${cu} - 0.01 then 'full' when ${passed} > 0.005 then 'part' when ${car} ilike 'fedex%' and ${unrec} = 1 then 'fxunrec' when ${comp} = 'S|Duplicate carrier charge' then 'dup' when ${topsub} = 'post_void_carrier_cost' then 'void' when ${topsub} = 'ups_return_to_sender_carrier_cost' then 'rts' when ${topsub} = 'base_invoice_above_purchase_quote' and ${car} ilike 'usps%' then 'uspsbase' when datediff('day', ${lastc}, current_date) <= 7 then 'recent' when ${topsub} = 'base_invoice_above_purchase_quote' then 'base' when ${topsub} = 'prior_invoice_upward_revision' then 'late' else 'none' end`;
const SQL_PT_COLS = `sum(iff(et = 'invoice_cost_true_up' and r < 0, -r, 0)) cu, sum(iff(et = 'merchant_surcharge_recovery', r, 0)) passed, max(iff(et = 'invoice_cost_true_up' and r < 0, at, null)) lastc, max_by(iff(et = 'invoice_cost_true_up' and r < 0, sub, null), iff(et = 'invoice_cost_true_up' and r < 0, -r, 0)) topsub`;
function sqlPld(sc, dir, { items = false, part = 0, parts = 1, min = 0 } = {}) {
  const ord = dir === 'u' ? 'asc' : 'desc';
  const sc2 = { ...sc, where: sc.where + (parts > 1 ? ` and mod(abs(hash(fulfillment_group_id)), ${parts | 0}) = ${part | 0}` : '') + (min > 0 ? ` and abs(diagnostic_variance_usd) >= ${+min}` : '') };

  return `with ${sqlIssueFgs(sc2, dir)},
${SQL_ADJ},
${SQL_DOM(ord)},

dg as (select merchant_id, fulfillment_group_id, any_value(label_count) lc, any_value(try_parse_json(origin_countries)[0]::string) org, any_value(try_parse_json(destination_countries)[0]::string) dst, sum(expected_spread_usd) es, sum(current_spread_usd) cs, sum(net_billed_to_merchant_usd) nb, sum(invoiced_amount_usd) ia from ${T.DIAG} where diagnostic_status = 'issue' and (merchant_id, fulfillment_group_id) in (select merchant_id, fulfillment_group_id from d) group by 1, 2),

${sqlLabelFacts('d', { items, more: true })},
x as (select d.issue_date, d.merchant_id, d.fulfillment_group_id, d.car, d.v, dom.comp, dom.r dr, dom.ds dds, dg.lc, dg.org, dg.dst, dg.es, dg.cs, dg.nb, dg.ia, sh.emc, sh.ecc, pt.cu, pt.passed, ${ps} ps, lab.tracking_code trk, lab.shipment_id sid, lab.label_provider lp, lab.label_purchased_at pa, inv.svc, inv.zone, nullif(lab.qw, 0) qw, ${SQL_RQ} rq, inv.bw, inv.aw, ${box('lab.ql', 'lab.qd', 'lab.qh')} qb, ${box('inv.bl', 'inv.bd', 'inv.bh')} bb, inv.rm, inv.descs, it.sku, it.title from d left join dom on dom.merchant_id = d.merchant_id and dom.fulfillment_group_id = d.fulfillment_group_id left join pt on pt.merchant_id = d.merchant_id and pt.fulfillment_group_id = d.fulfillment_group_id left join dg on dg.merchant_id = d.merchant_id and dg.fulfillment_group_id = d.fulfillment_group_id left join sh on sh.merchant_id = d.merchant_id and sh.fulfillment_group_id = d.fulfillment_group_id left join lab on lab.merchant_id = d.merchant_id and lab.fulfillment_group_id = d.fulfillment_group_id left join inv on inv.tracking_code = lab.tracking_code left join it on it.trk = lab.tracking_code)
select count(*) n, to_json(array_agg(array_construct(to_char(issue_date, 'YYYY-MM-DD'), merchant_id, fulfillment_group_id, car, round(v, 2), coalesce(comp, 'X|unexplained'), round(dr, 2), dds, lc, org, dst, round(es, 2), round(cs, 2), round(nb, 2), round(ia, 2), round(emc, 2), round(ecc, 2), round(cu, 2), round(passed, 2), ps, trk, sid, lp, to_char(pa, 'YYYY-MM-DD'), svc, zone, round(qw, 1), round(rq, 1), round(bw, 1), round(aw, 1), qb, bb, rm, descs, sku, title)) within group (order by issue_date, merchant_id, fulfillment_group_id)) pld from x`;

/* Step 4: issue dollars by label attribute next to a hash sample of every label bought in the same window

function sqlWhere(sc, dir) {
  const to = sc.to, pf = Math.min(sc.from, to - 27), days = to - pf + 1;

  let pw = `not is_oms_internal_team and label_purchased_at >= '${iso(pf)}' and label_purchased_at < '${iso(to + 1)}'`;
  if (popCars.length) pw += ` and carrier in (${popCars.join(', ')})`;
  if (sc.mids) pw += sc.mids.length ? ` and merchant_id in (${sc.mids.map((x) => `'${x}'`).join(', ')})` : ' and 1 = 0';
  if (rate < 1000) pw += ` and mod(abs(hash(shipment_id)), 1000) < ${rate}`;
  const cf = [sc.orgs?.length ? `o.ocn in (${sc.orgs.join(', ')})` : '', sc.dsts?.length ? `o.dc in (${sc.dsts.join(', ')})` : ''].filter(Boolean);
  const side = (p) => `greatest(coalesce(${p}quoted_length_in_inches, 0), coalesce(${p}quoted_width_in_inches, 0), coalesce(${p}quoted_height_in_inches, 0))`;

pl as (select merchant_id, shipment_id, tracking_code, quoted_weight_in_oz w, ${side('')} side from ${T.SHIP} where ${pw}),
l as (select 1 iss, d.v, il.merchant_id, il.shipment_id, il.tracking_code, il.w, il.side from d join il on il.merchant_id = d.merchant_id and il.fulfillment_group_id = d.fulfillment_group_id union all select 0, 0, merchant_id, shipment_id, tracking_code, w, side from pl),
o as (select "Shipment ID" sid, "Tracking Code" trk, "Is Redo Label" redo, "Service" svc, "Destination Address Country" dc, "Destination Address Province" dp, "Destination Address Zip" dz, "Origin Address Country" ocn, "Origin Address City" oc, "Origin Address Province" op, "Weight" ow, greatest(coalesce("Length", 0), coalesce("Width", 0), coalesce("Height", 0)) os, greatest(coalesce("USPS Zone", -1), coalesce("UPS Zone", -1), coalesce("FedEx Zone", -1)) zn from ${T.LABELS} where "Shipment ID" in (select shipment_id from l) qualify row_number() over (partition by "Shipment ID", "Tracking Code" order by "Label Purchased Date" desc) = 1),
x as (select l.iss, l.v, l.merchant_id mer, coalesce(nullif(l.w, 0), o.ow, 0) w, iff(l.side > 0, l.side, coalesce(o.os, 0)) side, o.sid, o.zn, o.redo, o.svc, o.dc, o.dp, o.dz, o.oc, o.op from l left join o on o.sid = l.shipment_id and o.trk = l.tracking_code${cf.length ? ` where l.iss = 1 or (${cf.join(' and ')})` : ''}),
y as (select iss, v, mer,
case when w <= 0 then 'Unknown' when w < 4 then '1' when w < 8 then '2' when w < 16 then '3' when w < 32 then '4' when w < 80 then '5' when w < 160 then '6' when w < 320 then '7' else '8' end wb,
case when side <= 0 then 'Unknown' when side < 12 then '1' when side < 18 then '2' when side < 22 then '3' when side < 30 then '4' else '5' end sz,
case when sid is null then 'Unknown' when zn between 1 and 9 then zn::string else 'Unknown' end zn,
case when sid is null then 'Unknown' when redo then 'Redo' else 'Merchant' end lt,
coalesce(nullif(svc, ''), 'Unknown') svc,
case when sid is null then 'Unknown' when dc = 'US' then coalesce(nullif(upper(dp), ''), 'Unknown') else 'Outside US' end dst,

g as (select case when grouping(wb) = 0 then 'weight' when grouping(sz) = 0 then 'size' when grouping(zn) = 0 then 'zone' when grouping(lt) = 0 then 'label' when grouping(svc) = 0 then 'service' when grouping(dst) = 0 then 'state' when grouping(zip) = 0 then 'zip' when grouping(org) = 0 then 'origin' when grouping(mer) = 0 then 'merchant' else 'all' end dim, coalesce(wb, sz, zn, lt, svc, dst, zip, org, mer, '') k, sum(v) iv, sum(iss) inn, count(*) - sum(iss) pn from y group by grouping sets ((wb), (sz), (zn), (lt), (svc), (dst), (zip), (org), (mer), ()))
select dim, k, round(iv, 2) iv, inn, pn from g where dim in ('all', 'weight', 'size', 'zone', 'label') or iv <> 0 qualify row_number() over (partition by dim order by abs(iv) desc, pn desc) <= 40`;

/* ---------------- data load ---------------- */
function setProgress(done, total) {
  const el = $('#prog');
  if (done == null) { el.style.width = '100%'; setTimeout(() => { el.style.transition = 'none'; el.style.width = '0'; requestAnimationFrame(() => (el.style.transition = '')); }, 400); return; }
  el.style.width = Math.max(4, (done / total) * 100) + '%';
  S.progressText = `Refreshing ${done} of ${total}`;
  renderFresh();
}
async function loadLive() {
  let done = 0; const total = CHUNKS + 3;
  setProgress(0, total);

/* ----- Reconcile ----- */
function reconRows() {
  const R = S.data.rec, g = S.grain, [from, to] = rangeDays();
  const out = [];
  for (const k of periods(from, to, g)) {
    const a = pStart(k, g), b = pEnd(k, g);
    let lbl = 0, trbh = 0, xp = 0, labels = 0;
    for (let d = a; d <= b; d++) { const r = R.daily.get(d); if (r) { lbl += r.cur; trbh += r.mr; xp += r.xp; labels += r.labels; } }
    let mr = trbh;
    if (g !== 'day' && R.monthly) {
      mr = 0;
      const y0 = dayDate(a), y1 = dayDate(b);
      for (let mk = y0.getUTCFullYear() * 12 + y0.getUTCMonth(); mk <= y1.getUTCFullYear() * 12 + y1.getUTCMonth(); mk++) mr += R.monthly.get(`${Math.floor(mk / 12)}-${String((mk % 12) + 1).padStart(2, '0')}`) || 0;
    }
    if (Math.abs(mr) < 0.01 && Math.abs(lbl) < 0.01) continue;
    out.push({ k, label: pLabel(k, g), long: pLabel(k, g, true), mr, lbl, xp, labels, gap: lbl - mr, pct: mr ? (lbl - mr) / Math.abs(mr) : null });
  }
  return out;
}

    ${rows.length ? `<div class="scroll"><table class="t"><thead><tr><th>Merchant</th><th>Status</th><th class="n">Open now</th><th>Updated</th></tr></thead><tbody>
    ${rows.map((a) => { const u = curU(a.m); return `<tr class="click" data-act="merchant" data-key="${a.m}"><td>${esc(D.M.name[a.m])}<small>${esc([a.owner, a.note].filter(Boolean).join(' · ').slice(0, 90))}</small></td><td>${statusPill(a.id)}</td><td class="n">${u < -0.01 ? `<span class="pill u">${money(u)}</span>` : '<span class="pill ok">Clear</span>'}</td><td>${esc((a.updatedAt || '').slice(0, 10))}<small>${esc(a.updatedBy || '')}</small></td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty">No merchants tracked yet. Open a merchant and set a status.</div>'}</div></div>`;

/* ----- Merchant drawer ----- */
function classify(r) {
  const v = +r.v, md = +r.billed - +r.ec, xd = +r.chg - md, xu = +r.x_unq;
  if (!+r.joined) return 4;
  if (v < 0) { if (+r.charges_n === 0 && +r.ec > 0) return 1; if (xd < -0.01 && xd <= md) return xu <= xd / 2 ? 9 : 2; if (md < -0.01) return 3; return 4; }
  if (xd > 0.01 && xd > md) return 5;
  if (md > 0.01) return 6;
  return 4;
}

function renderPopOpts() {
  if (!S.pop) return;
  const { dim, q } = S.pop, sel = S.f[dim];
  const a = agg({ by: dim, excl: dim });
  let items = [...a.groups].map(([k, g]) => ({ k, name: dimName(dim, k), u: g.u, o: g.o }));
  for (const k of sel) if (!a.groups.has(k)) items.push({ k, name: dimName(dim, k), u: 0, o: 0 });
  if (q) items = items.filter((x) => String(x.name).toLowerCase().includes(q));
  items.sort((x, y) => (sel.has(y.k) - sel.has(x.k)) || Math.abs(y.u) + y.o - (Math.abs(x.u) + x.o));
  const more = items.length - 200;
  items = items.slice(0, 200);
  $('#pop .opts').innerHTML = items.map((x) => `<div class="opt" data-opt="${x.k}"><span class="cb${sel.has(x.k) ? ' on' : ''}"></span><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span><span class="v">${x.u < 0 ? money(x.u) + ' under' : ''}${x.u < 0 && x.o > 0 ? ' · ' : ''}${x.o > 0 ? money(x.o) + ' over' : ''}</span></div>`).join('') + (more > 0 ? `<div class="opt"><span></span><span class="note">${cnt(more)} more. Search to narrow.</span></div>` : '') || '<div class="empty">No matches.</div>';
}

/* ---------------- CSV ---------------- */
function download(name, rows) {
  const csv = rows.map((r) => r.map((c) => { const s = String(c ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------- events ---------------- */
function applyChange() { savePrefs(); renderBar(); renderView(); if (S.pop) renderPopOpts(); }
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-tab],[data-preset],[data-grain],[data-dd],[data-opt],[data-popclear],[data-popdone],[data-clear],[data-rm],[data-drill],[data-act],[data-legend],[data-okind],[data-close],[data-status],[data-save],[data-export],[data-retry],[data-dx-cell],[data-dx-type],[data-dx-car],[data-dx-dir],[data-dx-rep],[data-dx-kind],[data-dx-reset],[data-dx-clear],[data-dx-mall],[data-dx-all],[data-dx-t],[data-v1],[data-v2],[data-wdim],[data-wall],[data-view],[data-top],[data-line],[data-ltab],[data-pld],[data-pld-dir],[data-pld-per],[data-pld-run],#refresh,#scrim');
  if (S.pop && !e.target.closest('#pop') && !e.target.closest('[data-dd]')) closePop();
  if (!el) return;
  const ds = el.dataset;
  const dx = S.dx;
  const pick = (type, carrier) => { const same = dx.type === type && dx.carrier === carrier; dx.type = same ? null : type; dx.carrier = same ? null : carrier; dx.auto = false; dx.rep = null; dx.mAll = false; renderView(); };
  if (ds.dxCell) { const [c, t] = ds.dxCell.split(':').map(Number); pick(t, c); }
  else if (ds.dxType) pick(+ds.dxType, null);
  else if (ds.dxCar) {
    const side = S.view !== 'both' ? null : e.target.closest('.dbar .l') ? 'u' : e.target.closest('.dbar .r') ? 'o' : null;
    if (side) { Object.assign(dx, { dir: side, carrier: +ds.dxCar, type: null, auto: false, rep: null, mAll: false }); renderView(); }
    else pick(null, +ds.dxCar);
  }
  else if (ds.dxT) { const t = +ds.dxT; dx.type = dx.type === t ? null : t; dx.auto = false; dx.rep = null; dx.mAll = false; renderView(); }
  else if (ds.dxDir) { if (dx.dir !== ds.dxDir) Object.assign(dx, { dir: ds.dxDir, type: null, rep: null, mAll: false }); renderView(); }
  else if (ds.v1 || ds.v2) { if (ds.v1) dx.v1 = ds.v1; else dx.v2 = ds.v2; savePrefs(); renderView(); }
  else if (ds.wdim) { dx.wdim = ds.wdim; dx.wAll = false; savePrefs(); renderWhereBody(); }
  else if ('wall' in ds) { dx.wAll = !dx.wAll; renderWhereBody(); }
  else if (ds.dxRep) { const r = +ds.dxRep; dx.rep = dx.rep === r ? null : r; dx.mAll = false; renderView(); }
  else if (ds.dxKind) { dx.repKind = ds.dxKind; dx.rep = null; renderView(); }
  else if ('dxReset' in ds) { dx.auto = true; dx.rep = null; dx.mAll = false; renderView(); }
  else if (ds.dxClear) { if (ds.dxClear === 'rep') dx.rep = null; else { dx[ds.dxClear] = null; dx.auto = false; dx.rep = null; } renderView(); }
  else if ('dxMall' in ds) { dx.mAll = !dx.mAll; renderView(); }
  else if ('dxAll' in ds) { dx.type = null; dx.carrier = null; dx.auto = false; renderView(); }
  else if (ds.tab) { S.tab = ds.tab; closePop(); savePrefs(); render(); window.scrollTo(0, 0); }
  else if (ds.preset) { S.range = { preset: ds.preset }; applyChange(); }
  else if (ds.grain) { S.grain = ds.grain; applyChange(); }
  else if (ds.dd) { if (S.pop?.dim === ds.dd) closePop(); else openPop(ds.dd, el); }
  else if (ds.opt != null && S.pop) { const k = +ds.opt, set = S.f[S.pop.dim]; set.has(k) ? set.delete(k) : set.add(k); applyChange(); }
  else if ('popclear' in ds && S.pop) { S.f[S.pop.dim].clear(); applyChange(); }
  else if ('popdone' in ds) closePop();
  else if ('clear' in ds) { for (const s of Object.values(S.f)) s.clear(); if (S.range.from != null) S.range = { preset: 'all' }; applyChange(); }
  else if (ds.rm) { if (ds.rm === 'range') S.range = { preset: 'all' }; else { const [dim, k] = ds.rm.split(':'); S.f[dim].delete(+k); } applyChange(); }
  else if (ds.drill) {
    const [id, i] = ds.drill.split(':'), d = DRILL[id]?.[+i]; if (!d) return;
    S.range = { from: pStart(d.k, d.g), to: pEnd(d.k, d.g), label: pLabel(d.k, d.g, true) };
    S.grain = FINER[d.g]; hideTip(); applyChange();
  }
  else if (ds.act) {
    const key = ds.key;
    if (ds.act === 'merchant') openMerchant(+key);
    else if (ds.act === 'owner') { S.ownerSel[S.ownerKind] = +key; renderView(); }
    else if (ds.act.startsWith('filter:')) { const dim = ds.act.slice(7), set = S.f[dim], k = +key; set.has(k) ? set.delete(k) : set.add(k); applyChange(); }
  }
  else if (ds.view) { S.view = ds.view; applyView(); applyChange(); if (S.drawer && S.drawer.kind !== 'line') renderDrawer(true); }
  else if (ds.top) { const [d, i] = ds.top.split(':'); openTopLine(d, +i); }
  else if (ds.line) { const D = S.data; openLine({ comp: ds.line, name: ds.lname || compName(ds.line), group: COMP_GROUP[ds.line[0]] || 'Line item', dir: dx.dir, sc: scopeSql(), carrier: dx.carrier != null ? D.carriers[dx.carrier] : null, type: dx.type != null ? TYPE_BY[dx.type]?.name : null }); }
  else if (ds.ltab && S.drawer?.kind === 'line') { S.drawer.ltab = ds.ltab; renderDrawer(true); }
  else if (ds.export === 'line') exportLine();
  else if ('pld' in ds) openPld();
  else if (ds.pldDir && S.drawer?.kind === 'pld' && !S.drawer.running) { S.drawer.dir = ds.pldDir; renderPldDrawer(true); }
  else if (ds.pldPer && S.drawer?.kind === 'pld' && !S.drawer.running) { S.drawer.period = ds.pldPer; renderPldDrawer(true); }
  else if ('pldRun' in ds) runPld();
  else if (ds.okind) { S.ownerKind = ds.okind; renderView(); }
  else if ('close' in ds || el.id === 'scrim') closeDrawer();
  else if (ds.status && S.drawer) { S.drawer.form.status = ds.status; document.querySelectorAll('[data-status]').forEach((b) => b.classList.toggle('on', b.dataset.status === ds.status)); }
  else if ('save' in ds) saveFix();
  else if ('retry' in ds) { S.error = null; renderView(); refresh(); }
  else if (el.id === 'refresh') refresh();
  else if (ds.export === 'recon') download(`label-revenue-vs-monthly-report-${S.grain}.csv`, [['period', 'monthly_report', 'label_view', 'gap', 'gap_pct', 'labels'], ...reconRows().map((r) => [r.long, r.mr.toFixed(2), r.lbl.toFixed(2), r.gap.toFixed(2), r.pct == null ? '' : (r.pct * 100).toFixed(2), r.labels])]);
  else if (ds.export === 'ships' && S.drawer) {
    const D = S.data, name = D.M.name[S.drawer.m];
    download(`${name.replace(/[^A-Za-z0-9]+/g, '-').toLowerCase()}-shipments.csv`, [['fulfillment_group', 'tracking', 'carrier', 'labels', 'bought', 'issue_date', 'issue_type', 'gap', 'merchant_billed', 'merchant_expected', 'carrier_cost', 'carrier_quote'],
      ...S.drawer.ships.map((r) => { const md = +r.billed - +r.ec, xd = +r.chg - md; return [r.fg, r.trk, r.car, r.trks, r.bought, r.issued, TYPE_BY[classify(r)]?.name, (+r.v).toFixed(2), (+r.billed).toFixed(2), (+r.ec).toFixed(2), (+r.ecc - xd).toFixed(2), (+r.ecc).toFixed(2)]; })]);
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-popq]') && S.pop) { S.pop.q = e.target.value.trim().toLowerCase(); renderPopOpts(); }
  else if (e.target.dataset.form && S.drawer?.form) S.drawer.form[e.target.dataset.form] = e.target.value;
  else if (e.target.dataset.pldf && S.drawer?.kind === 'pld') { S.drawer[e.target.dataset.pldf] = e.target.value; if (e.target.type === 'date') renderPldDrawer(true); }
});
document.addEventListener('change', (e) => { if (e.target.dataset.pldc && S.drawer?.kind === 'pld') { S.drawer[e.target.dataset.pldc] = e.target.checked; renderPldDrawer(true); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.pop) closePop(); else if (S.drawer) closeDrawer(); } });
const tip = $('#tip');
function hideTip() { tip.classList.remove('on'); }
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) return hideTip();
  const [id, i] = t.dataset.tip.split(':'), html = TIPS[id]?.[+i];
  if (!html) return hideTip();
  if (tip.dataset.k !== t.dataset.tip) { tip.innerHTML = html; tip.dataset.k = t.dataset.tip; }
  tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 16, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 16;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawSlots(); }, 150); });
setInterval(() => { renderFresh(); if (S.data && !S.loading && Date.now() - S.data.fetchedAt > STALE_MS && document.visibilityState === 'visible') refresh(); }, 60000);

/* Brand fonts: assets/fonts.css ships with git deploys and Google Fonts is linked as a second source.
   If neither loaded Instrument Serif, pull the same fonts.css from the data store. */
async function ensureFonts() {
  try {
    await document.fonts.ready;
    await new Promise((r) => setTimeout(r, 2500));
    if ([...document.fonts].some((f) => f.family.replace(/["']/g, '') === 'Instrument Serif' && f.status === 'loaded')) return;
    const css = await withStore((h) => h.files.text('assets/fonts.css'));
    if (css && css.includes('@font-face')) { const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st); }
  } catch {}
}

/* ---------------- boot ---------------- */
(async function boot() {
  render();
  try { await initSdk(); }
  catch (e) { S.error = 'This page needs the Fridge runtime. Open it from its fridge.redo.builders address. (' + msg(e) + ')'; renderView(); renderFresh(); return; }
  loadSide();
  ensureFonts();
  let raw = readLocal();
  const remote = await readRemote();
  if (remote && (!raw || remote.fetchedAt > raw.fetchedAt)) raw = remote;
  if (raw) setRaw(raw, 'cache');
  if (!raw || Date.now() - raw.fetchedAt > STALE_MS) await refresh();
})();
</script>
