<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue Integrity · Shipping Cloud</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23141414%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%23FF4405%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F6F4;--surface:#FFFFFF;--ink:#2A2A28;--ink2:#5A5955;--muted:#9B9A96;--line:#E4E3DF;--line2:#F0EFED;--black:#141414;
  --under:#FF4405;--over:#088AB2;--under-ink:#C23300;--over-ink:#066A89;--good:#16A34A;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/20px var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.chrome{position:sticky;top:0;z-index:20}
.top{background:var(--black);color:#fff}
.wrap{max-width:1360px;margin:0 auto;padding:0 48px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand svg{height:22px;width:auto;display:block;color:#fff;flex:none}
.brand .sep{width:1px;height:24px;background:rgba(255,255,255,.16);flex:none}
.brand .app{font:400 26px/28px var(--serif);letter-spacing:-.01em;white-space:nowrap}
.brand .scope{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.fresh{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--muted);text-align:right}
.fresh b{color:#fff;font-weight:500}
.icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:2px;background:var(--black)}
.prog i{display:block;height:2px;width:0;background:var(--under);transition:width .4s}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:32px}
.tabs button{padding:16px 0 14px;border-bottom:2px solid transparent;font-weight:500;color:var(--ink2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--under)}
.bar{background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;padding-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px}
.seg button{padding:4px 12px;border-radius:6px;font-size:12px;line-height:20px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.vsep{width:1px;height:24px;background:var(--line);margin:0 8px}
.dd{padding:4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px;line-height:20px;font-weight:500;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}
.dd:hover{border-color:var(--muted)}
.dd.on{border-color:var(--ink);color:var(--ink)}
.dd b{background:var(--ink);color:#fff;border-radius:8px;padding:0 6px;font-size:11px;line-height:16px}
.dd .car{font-size:9px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:2px 4px 2px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12px;line-height:20px}
.chip em{font-style:normal;color:var(--muted)}
.chip button{width:20px;height:20px;border-radius:10px;color:var(--muted)}
.chip button:hover{background:var(--line2);color:var(--ink)}
.linkbtn{font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
main.wrap{padding-top:24px;padding-bottom:64px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.own{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.mt{margin-top:16px}
.kpi.pick{cursor:pointer;transition:box-shadow .1s}
.kpi.pick:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.kpi.pick.on{box-shadow:inset 0 0 0 2px var(--ink)}
.hl{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:center;border-left:4px solid var(--under)}
.hl.o{border-left-color:var(--over)}
.hl .eyebrow{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.hl h2{font:400 32px/40px var(--serif);margin:4px 0 8px;letter-spacing:-.01em}
.hl h2 .muted{color:var(--muted)}
.hl-sub{font-size:13px;color:var(--ink2)}
.fixline{font-size:13px;color:var(--ink2);margin-top:4px}
.fixline b{font-weight:600;color:var(--ink);margin-right:4px}
.lnk{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:12px}
.crumb{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 12px;border-radius:16px;background:var(--line2);color:var(--ink);font-weight:500;line-height:20px}
.crumb:first-child{padding-right:12px}
.crumb button{width:20px;height:20px;border-radius:10px;color:var(--muted)}
.crumb button:hover{background:#fff;color:var(--ink)}
.sepr{color:var(--muted)}
.hl-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hl-facts span{display:block;font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hl-facts b{display:block;font:400 32px/40px var(--serif);font-weight:400;white-space:nowrap}
.mx-wrap{overflow-x:auto;margin:0 -8px}
table.mx{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px;min-width:720px}
.mx th{font:600 12px/16px var(--sans);color:var(--ink);text-align:left;padding:8px;cursor:pointer;border-radius:6px;vertical-align:bottom}
.mx th small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.mx thead th{text-align:center;min-width:104px}
.mx th.corner{cursor:default;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mx tbody th{white-space:nowrap}
.mx th:hover,.mx td[data-dx-cell]:hover,.mx td.tot:hover{box-shadow:inset 0 0 0 1px var(--ink2)}
.mx td{text-align:center;padding:12px 8px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap}
.mx td.nil{color:var(--muted);background:var(--bg);cursor:default}
.mx .tot{background:var(--bg);font-weight:600}
.mx .on{box-shadow:inset 0 0 0 2px var(--ink)!important}
.mx td.best{font-weight:700}
.hb{display:inline-block;width:120px;height:8px;border-radius:4px;background:var(--line2);vertical-align:middle;margin-right:8px;overflow:hidden}
.hb i{display:block;height:8px;border-radius:4px}
.barcell{white-space:nowrap}
.barcell b{font-weight:600;font-variant-numeric:tabular-nums}
.t tr.sel td{background:var(--line2)}
.t tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--ink)}
.t .nm{font-weight:600}
.reps td{vertical-align:middle}
.dirseg button{display:inline-flex;align-items:center;gap:6px}
.dirseg button.on .dot{box-shadow:0 0 0 2px #fff}
.wf-r.click{cursor:pointer;border-radius:4px}
.wf-r.click:hover{background:var(--line2)}
.wf-r.click .nm span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.btn.sm{padding:4px 12px;font-size:12px}
.muted{color:var(--muted)}
.aib{display:inline-block;font:700 10px/16px var(--sans);letter-spacing:.06em;padding:0 6px;border-radius:4px;background:var(--ink);color:#fff;margin-right:8px;vertical-align:1px}
.brief .eyebrow{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.bl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.bl li{padding:8px 12px;border-left:3px solid var(--under);background:var(--bg);border-radius:0 6px 6px 0;font-size:14px;line-height:20px}
.bl li.o{border-left-color:var(--over)}
.tops{display:grid}
.intro p{margin:8px 0 0;font-size:14px;line-height:22px;color:var(--ink2);max-width:920px}
.intro b{font-weight:600}
.intro b.u{color:var(--under-ink)}
.intro b.o{color:var(--over-ink)}
.bgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.bgroup h4,.story h4{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.tc{display:grid;grid-template-columns:32px minmax(0,1fr);gap:16px;padding:24px 0;border-top:1px solid var(--line)}
.tc:first-child{border-top:0;padding-top:0}
.tc .rk{width:32px;height:32px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font:400 20px/1 var(--serif);color:var(--ink)}
.tc .th{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:24px;align-items:start}
.tc .mn{font:400 28px/34px var(--serif);margin:0;letter-spacing:-.01em;color:var(--ink);text-transform:none}
.tc .hd{font-size:15px;line-height:22px;font-weight:600;color:var(--ink);margin:4px 0 0}
.tc .stat{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:6px;background:var(--line2);font-size:13px;line-height:18px;color:var(--ink2)}
.tc .stat.u{background:rgba(255,68,5,.08);color:var(--under-ink)}
.tc .stat.o{background:rgba(8,138,178,.08);color:var(--over-ink)}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:16px}
.story p{margin:0;font-size:14px;line-height:22px;color:var(--ink)}
.story ol{margin:0;padding-left:20px;font-size:14px;line-height:22px;color:var(--ink)}
.story li+li{margin-top:6px}
.tc .tf{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px;font-size:12px;color:var(--muted)}
.tc .tf .grow{flex:1}
.tc .tf .by{font-style:italic}
.tc .ta{text-align:right}
.tc .ta b{display:block;font:400 32px/40px var(--serif);white-space:nowrap}
.tc .ta b.u{color:var(--under-ink)}
.tc .ta b.o{color:var(--over-ink)}
.tc .ta small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tbar{display:block;height:6px;border-radius:3px;background:var(--line2);margin-top:6px;overflow:hidden}
.tbar i{display:block;height:6px;border-radius:3px;margin-left:auto}
.tbar i.u{background:var(--under)}
.tbar i.o{background:var(--over)}
.mtrs{display:grid;gap:12px;margin-top:12px}
.mtr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px;gap:16px;align-items:center}
.mtr .ml b{display:block;font-size:13px;font-weight:600}
.mtr .ml small{display:block;font-size:12px;color:var(--muted);line-height:16px}
.mb{display:block;height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.mb i{display:block;height:10px;border-radius:5px}
.mb i.u{background:var(--under)}
.mb i.o{background:var(--over)}
.mp{font:400 24px/28px var(--serif);text-align:right}
.sh{white-space:nowrap;font-variant-numeric:tabular-nums}
.sh .arw{color:var(--muted)}
.sh b{font-weight:600}
.sh b.bad{color:var(--under-ink)}
.t td.n.u{color:var(--under-ink);font-weight:600}
.t td.n.o{color:var(--over-ink);font-weight:600}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:14px;background:var(--ink);color:#fff;font:600 13px/1 var(--sans);margin-right:12px;vertical-align:4px}
.hdr-r{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.crumbs .grow{flex:1}
.lede{font-size:14px;line-height:20px;color:var(--ink);margin:0 0 12px}
.lede b{font-weight:600}
.nw{white-space:nowrap}
.cc-lg{display:none;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.cc-lg .dot+.dot,.cc-lg .dot.u,.cc-lg .dot.o{margin-left:8px}
.cc-lg span{color:var(--muted);margin-left:8px}
.s3{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:32px}
#bridge.minh{min-height:280px}
#where.minh{min-height:520px}
.t td.u{color:var(--under-ink)}
.t td.o{color:var(--over-ink)}
.t tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.t.piv thead th,.t.piv tfoot td{position:sticky;background:var(--surface);z-index:1}
.t.piv thead th{top:0}
.t.piv tfoot td{bottom:0}
table.mx.piv{min-width:0}
.mx.piv thead th{min-width:64px;text-align:right;cursor:default}
.mx.piv thead th.corner{text-align:left}
.mx.piv thead th:hover{box-shadow:none}
.mx.piv td{padding:10px 8px;text-align:right}
.wf-r{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr) 72px 64px;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line2);font-size:13px;line-height:18px}
.wf-r .nm{min-width:0}
.wf-r .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-r .trk{position:relative;height:20px}
.wf-r .trk i{position:absolute;top:4px;height:12px;border-radius:2px}
.wf-r .trk i.u{background:var(--under)}
.wf-r .trk i.o{background:var(--over)}
.wf-r .trk i.k{background:var(--ink)}
.wf-r .z{position:absolute;top:-7px;bottom:-7px;width:1px;background:var(--line)}
.wf-r .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.wf-r .amt.u{color:var(--under-ink)}
.wf-r .amt.o{color:var(--over-ink)}
.wf-r .cnt{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wf-r.wf-h{border-top:0;font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wf-r.wf-h .amt{color:var(--muted)}
.wf-r.wf-g{border-top:0;padding-top:12px;font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.wf-r.wf-g .amt{font-size:12px;letter-spacing:0;color:var(--ink2)}
.wf-r.tot{border-top:2px solid var(--ink);margin-top:4px;font-weight:600}
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ins button{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 16px;border-radius:8px;background:var(--bg);border:1px solid var(--line);min-width:0}
.ins button:hover{border-color:var(--muted)}
.ins button.on{border-color:var(--ink)}
.ins .lbl{font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ins .big{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.ins .big b{font:400 24px/28px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ins .big em{font:600 20px/28px var(--sans);font-style:normal;flex:none}
.ins em.u{color:var(--under-ink)}
.ins em.o{color:var(--over-ink)}
.ins .meta{font-size:12px;line-height:16px;color:var(--ink2)}
.cc-r{display:grid;grid-template-columns:minmax(0,26%) minmax(0,1fr) 80px 80px 72px;gap:16px;align-items:center;padding:8px;border-top:1px solid var(--line2);border-radius:4px}
.cc-r.click{cursor:pointer}
.cc-r.click:hover{background:var(--line2)}
.cc-r .nm{font-weight:500;font-size:13px;line-height:18px;min-width:0}
.cc-r .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-r .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-b{display:grid;grid-template-columns:minmax(0,1fr) 40px;column-gap:8px;row-gap:4px;align-items:center}
.cc-b .trk{display:block;height:8px}
.cc-b i{display:block;height:8px;border-radius:0 4px 4px 0}
.cc-b i.p{background:#CFCDC7}
.cc-b i.u{background:var(--under)}
.cc-b i.o{background:var(--over)}
.cc-b em{font-style:normal;font-size:11px;line-height:12px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.cc-r .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;white-space:nowrap}
.cc-r .lift{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);white-space:nowrap}
.cc-r .lift.hi{font-weight:700}
.cc-r .lift.hi.u{color:var(--under-ink)}
.cc-r .lift.hi.o{color:var(--over-ink)}
.cc-r .lift.lo{color:var(--muted)}
.cc-r .cnt{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cc-r.cc-h{border-top:0;cursor:default}
.cc-r.cc-h>span{font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cc-r.cc-h>span.lg{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.cc-r.cc-h .lg .dot+.dot,.cc-r.cc-h .lg .dot.u,.cc-r.cc-h .lg .dot.o{margin-left:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.card h2{font:400 24px/32px var(--serif);margin:0;letter-spacing:-.005em}
.card h3{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.sub{font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.kpi .lbl{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.kpi .val{font:400 44px/48px var(--serif);letter-spacing:-.01em;margin-top:8px;white-space:nowrap}
.kpi .meta{font-size:12px;line-height:16px;color:var(--muted);margin-top:8px}
.kpi .delta{font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.u{background:var(--under)}.dot.o{background:var(--over)}.dot.k{background:var(--ink)}.dot.g{background:var(--muted)}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink2)}
.legend button,.legend span{display:inline-flex;gap:8px;align-items:center}
.legend .off{opacity:.35}
.tabs2{display:flex;flex-wrap:wrap;gap:4px}
.tabs2 button{padding:4px 12px;border-radius:16px;font-size:12px;line-height:20px;font-weight:500;color:var(--ink2);border:1px solid transparent}
.tabs2 button.on{border-color:var(--ink);color:var(--ink)}
.slot{width:100%;position:relative}
svg.chart{display:block;overflow:visible}
svg.chart text{font:11px var(--sans);fill:var(--muted)}
svg.chart .grid{stroke:var(--line2);stroke-width:1}
svg.chart .zero{stroke:var(--line);stroke-width:1}
svg.chart .hit{fill:transparent;cursor:pointer}
svg.chart .hit:hover{fill:rgba(13,13,13,.04)}
svg.chart .nohit{cursor:default}

/* Revenue Integrity: catches, diagnoses and tracks fixes for Shipping Cloud label revenue issues.

const STORE_KEY = 'shipping-rev-rec';
const DATA_VERSION = 1;
const CACHE_PATH = 'cache/data-v1.json';
const LS_KEY = 'rri:data:v1';

  ADJ: 'KITCHEN.REVENUE.OUTBOUND_LABEL_REVENUE_ADJUSTMENTS',
  TRBH: 'KITCHEN.REVENUE.TOTAL_REVENUE_BY_HOUR',
  MR: ['KITCHEN.FINANCE.MONTHLY_REPORT_V2', 'KITCHEN.PANTRY.INGR_MONTHLY_REPORT_V2'],

  INVOICE: 'KITCHEN.PANTRY.INGR_LABEL_INVOICE_DETAIL',

  HSC: 'KITCHEN.REV_OPS.HUBSPOT_COMPANIES',
  HSD: 'KITCHEN.REV_OPS.HUBSPOT_DEALS',

// Issue types. Codes match the CASE expression in SQL_TYPE (8, positive "other", folds into 4).
const TYPES = [

  { code: 3, dir: -1, name: 'Merchant under-billed', why: 'Merchant was charged less than expected (refund or partial charge).', fix: 'Collect the shortfall and check the refund.' },
  { code: 9, dir: -1, name: 'Carrier billed extra label', why: 'Carrier billed a label we never quoted (extra piece or voided label).', fix: 'Dispute with the carrier or bill the merchant for the extra piece.' },
  { code: 1, dir: -1, name: 'Merchant not billed', why: 'Label was bought but the merchant was never charged.', fix: 'Charge the merchant for the label.' },

  { key: 'carrier', label: 'Carrier' }, { key: 'merchant', label: 'Merchant' }, { key: 'origin', label: 'Origin' },
  { key: 'dest', label: 'Destination' }, { key: 'type', label: 'Issue type' }, { key: 'pa', label: 'PA' }, { key: 'se', label: 'SE' },
];

const STATUS = { open: 'Open', working: 'In progress', fixed: 'Fixed' };

const S = {
  tab: 'issues', grain: 'month', range: { preset: 'all' }, show: { u: true, o: true },
  f: { carrier: new Set(), merchant: new Set(), origin: new Set(), dest: new Set(), type: new Set(), pa: new Set(), se: new Set() },

  if (Math.abs(v) < 1e-9) return '$0';
  const a = Math.abs(v);

const dayDate = (i) => new Date(EPOCH_MS + i * 864e5);
const dIdx = (y, m, d) => Math.round((Date.UTC(y, m, d) - EPOCH_MS) / 864e5);
const iso = (i) => dayDate(i).toISOString().slice(0, 10);
const denverToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const todayIdx = () => { const [y, m, d] = denverToday().split('-').map(Number); return dIdx(y, m - 1, d); };
const PKC = {};
function pk(day, g) {

let fridge = null, me = null;

function normRows(res) {
  if (!res) return [];
  const lower = (o) => { const r = {}; for (const k in o) r[k.toLowerCase()] = o[k]; return r; };
  if (Array.isArray(res)) return res.map((r) => (Array.isArray(r) ? r : lower(r)));
  const meta = res.resultSetMetaData || res.result_set?.resultSetMetaData;
  const data = res.rows ?? res.data ?? res.result_set?.data;
  if (Array.isArray(data) && data.length && Array.isArray(data[0]) && meta?.rowType) {
    const cols = meta.rowType.map((c) => String(c.name).toLowerCase());
    return data.map((a) => Object.fromEntries(cols.map((c, i) => [c, a[i]])));
  }
  if (Array.isArray(data)) return data.map((r) => (r && typeof r === 'object' && !Array.isArray(r) ? lower(r) : r));
  return [];
}
async function sf(sql, attempts = 2) {
  if (/--|\/\*|;/.test(sql)) throw new Error('SQL must be a single statement without comments');
  for (let i = 1; ; i++) {
    try { return normRows(await fridge.snowflake.query(sql, { limit: 500, timeoutMs: SF_TIMEOUT_MS })); }
    catch (e) {
      if (i >= attempts || !/timed out|network|failed to fetch|50[234]|ECONN|aborted|queued/i.test(msg(e))) throw e;
      await new Promise((r) => setTimeout(r, 1500 * i));
    }
  }
}

  try { if (fridge?.stores?.open) hs.push(fridge.stores.open(STORE_KEY)); } catch {}
  try { if (fridge?.stores?.default) hs.push(fridge.stores.default); } catch {}

}
async function withStore(fn) {

}
function normDocs(res) {
  const arr = Array.isArray(res) ? res : res?.items ?? res?.documents ?? res?.rows ?? res?.data ?? [];
  return arr.map((it) => (it && typeof it === 'object' && it.value && typeof it.value === 'object'
    ? { key: it.key ?? it.documentKey ?? it.id, value: it.value }

}
async function colList(name) {

  for (const t of ticks) g += `<line x1="${ml}" x2="${w - mr}" y1="${Y(t)}" y2="${Y(t)}" class="${t === 0 ? 'zero' : 'grid'}"/><text x="${ml - 8}" y="${Y(t) + 4}" text-anchor="end">${axisMoney(t)}</text>`;
  pts.forEach((p, i) => {
    const x = ml + i * band + (band - bw) / 2;
    if (show.o && p.o > 0) g += `<path d="${barPath(x, Y(0), Y(p.o), bw, r)}" fill="${colors[1]}"/>`;
    if (show.u && p.u < 0) g += `<path d="${barPath(x, Y(0), Y(p.u), bw, r)}" fill="${colors[0]}"/>`;
  });
  pts.forEach((p, i) => { g += `<rect class="hit${drill ? '' : ' nohit'}" x="${ml + i * band}" y="${mt}" width="${band}" height="${ih}" data-tip="${id}:${i}"${drill ? ` data-drill="${id}:${i}"` : ''}/>`; });
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 64))));

/* Grouped columns (two series, one axis) or lines when too many points. series: [{name, color, ys}] */

      if (n <= 60) s.ys.forEach((y, i) => { g += `<circle cx="${(ml + i * band + band / 2).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });

  labels.forEach((_, i) => { g += `<rect class="hit nohit" x="${ml + i * band}" y="${mt}" width="${band}" height="${ih}" data-tip="${id}:${i}"/>`; });
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 64))));
  labels.forEach((l, i) => { if (i % every === 0) g += `<text x="${ml + i * band + band / 2}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`; });

}
/* Diverging horizontal rows. items: [{key, name, sub, u, o, right, act}] */

/* ----- Issues ----- */
function kpi(label, dot, val, meta, pick) {

}
function waitingFor(ms) {
  const M = S.data.M; let p = 0, r = 0, pn = 0, rn = 0;
  const list = ms ?? M.id.map((_, i) => i);
  for (const m of list) { p += M.pend[m]; r += M.rvw[m]; pn += M.pendN[m]; rn += M.rvwN[m]; }
  return { p, r, pn, rn };
}
/* Diagnose path, in five steps: (1) totals over time, (2) which carriers, (3) what was billed,

function dxCompute() {
  const D = S.data, M = D.M, dx = S.dx, under = dx.dir === 'u';
  const pass = rowFilter();
  const add = (map, k, v, n, m, withM) => {
    let g = map.get(k);
    if (!g) map.set(k, (g = { v: 0, n: 0, ms: new Set(), mv: withM ? new Map() : null }));
    g.v += v; g.n += n; g.ms.add(m);
    if (withM) g.mv.set(m, (g.mv.get(m) || 0) + v);
    return g;
  };
  const cells = new Map(), rows = new Map(), cols = new Map(), tot = { v: 0, n: 0, ms: new Set() };
  for (let i = 0; i < D.n; i++) {
    const v = D.v[i];
    if ((under ? v >= 0 : v <= 0) || !pass(i)) continue;
    const c = D.c[i], t = D.t[i], m = D.m[i], n = D.cnt[i];
    add(cells, c * 100 + t, v, n, m); add(rows, c, v, n, m); add(cols, t, v, n, m);
    tot.v += v; tot.n += n; tot.ms.add(m);
  }
  let best = null;
  for (const [c, g] of rows) if (!best || Math.abs(g.v) > Math.abs(best.g.v)) best = { c, g };
  if (!dx.auto && dx.carrier != null && !rows.has(dx.carrier)) dx.auto = true;
  if (dx.auto) { dx.carrier = best ? best.c : null; dx.type = null; }
  const types = dx.carrier == null ? cols : new Map([...cells].filter(([k]) => Math.floor(k / 100) === dx.carrier).map(([k, g]) => [k % 100, g]));
  if (dx.type != null && !types.has(dx.type)) dx.type = null;
  const merch = new Map(), reps = new Map(), sel = { v: 0, n: 0, ms: new Set() };
  for (let i = 0; i < D.n; i++) {
    const v = D.v[i];
    if ((under ? v >= 0 : v <= 0) || (dx.type != null && D.t[i] !== dx.type) || (dx.carrier != null && D.c[i] !== dx.carrier) || !pass(i)) continue;
    const m = D.m[i], n = D.cnt[i], r = M[dx.repKind][m];
    add(reps, r, v, n, m, true);
    if (dx.rep != null && r !== dx.rep) continue;
    add(merch, m, v, n, m);
    sel.v += v; sel.n += n; sel.ms.add(m);
  }
  return { cells, rows, cols, tot, best, types, merch, reps, sel };
}
function dxTitle() {
  const D = S.data, dx = S.dx, word = dx.dir === 'u' ? 'under-billing' : 'over-billing';
  const tName = dx.type != null ? TYPE_BY[dx.type]?.name : null, cName = dx.carrier != null ? D.carriers[dx.carrier] : null;
  return tName && cName ? `${tName} at ${cName}` : tName ? `${tName}, all carriers` : cName ? `All ${word} at ${cName}` : `All ${word}`;
}
function statusMix(ms) {

function hbar(v, mx, under) {

const stepH = (n, title, sub, right = '') => `<div class="card-h"><div><h2><span class="step">${n}</span>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${right ? `<div class="hdr-r">${right}</div>` : ''}</div>`;

/* Step 1: every issue, good and bad, by period. */

      ${rows.map((r) => `<tr class="click" data-drill="${id}:${r.i}"><td>${esc(pLabel(r.k, g, true))}</td><td class="n u">${money(r.s.u)}</td><td class="n o">${money(r.s.o)}</td><td class="n">${money(r.s.u + r.s.o, true)}</td><td class="n">${cnt(r.s.un + r.s.on)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Total</td><td class="n u">${money(t.u)}</td><td class="n o">${money(t.o)}</td><td class="n">${money(t.u + t.o, true)}</td><td class="n">${cnt(t.un + t.on)}</td></tr></tfoot></table></div>`;
  } else body = slot('v-main', 260, (w, hh) => colChart(pts, w, hh, { drill: ks.map((k) => ({ k, g })), show: S.show }));

/* Step 2: which carriers. Totals (both directions), a carrier x period pivot, or a carrier x issue type pivot. */
function step2(X, from, to, g) {
  const D = S.data, dx = S.dx, under = dx.dir === 'u';
  const views = [['bars', 'Totals'], ['time', 'By ' + g], ['type', 'By issue type']];
  let body, sub, right = seg('v2', dx.v2, views);
  if (dx.v2 === 'time') { body = carrierTime(from, to, g); sub = `${under ? 'Under' : 'Over'}-billed by carrier and ${g}. Darker means more dollars. Click a carrier to diagnose it.`; right = segDir() + right; }
  else if (dx.v2 === 'type') { body = mxTable(X); sub = `${under ? 'Under' : 'Over'}-billed by carrier and issue type. The outlined cell is selected. Click any cell, carrier or issue.`; right = segDir() + right; }
  else {
    const b = agg({ by: 'carrier' });
    const items = sortItems([...b.groups].map(([k, gr]) => ({ key: k, name: D.carriers[k], sub: `${cnt(gr.ms.size)} merchants`, u: gr.u, o: gr.o, right: cnt(gr.un + gr.on) })));
    body = drows(items, { sel: dx.carrier, attr: (x) => `data-dx-car="${x.key}"` });

function carrierTime(from, to, g) {
  const D = S.data, dx = S.dx, under = dx.dir === 'u', pass = rowFilter();
  const ks = periods(from, to, g), last = ks.slice(-(g === 'day' ? 14 : 12)), lo = pStart(last[0], g);
  const m = new Map();
  for (let i = 0; i < D.n; i++) {
    const v = D.v[i];
    if ((under ? v >= 0 : v <= 0) || D.day[i] < lo || !pass(i)) continue;
    let r = m.get(D.c[i]);
    if (!r) m.set(D.c[i], (r = new Map([['t', 0]])));
    const k = pk(D.day[i], g);
    r.set(k, (r.get(k) || 0) + v); r.set('t', r.get('t') + v);
  }
  if (!m.size) return '<div class="empty">Nothing matches these filters.</div>';
  const rows = [...m].sort((a, b) => Math.abs(b[1].get('t')) - Math.abs(a[1].get('t')));
  let mx = 0;
  for (const [, r] of rows) for (const k of last) mx = Math.max(mx, Math.abs(r.get(k) || 0));
  const rgb = under ? '255,68,5' : '8,138,178';
  const cell = (v, c) => v ? `<td data-dx-car="${c}" style="background:rgba(${rgb},${(0.05 + 0.5 * Math.sqrt(Math.abs(v) / (mx || 1))).toFixed(3)})">${money(v)}</td>` : '<td class="nil">·</td>';
  let h = `<thead><tr><th class="corner">Carrier</th>${last.map((k) => `<th>${esc(pLabel(k, g))}</th>`).join('')}<th class="tot">Total</th></tr></thead><tbody>`;
  for (const [c, r] of rows) h += `<tr><th class="row${dx.carrier === c ? ' on' : ''}" data-dx-car="${c}">${esc(D.carriers[c])}</th>${last.map((k) => cell(r.get(k) || 0, c)).join('')}<td class="tot" data-dx-car="${c}">${money(r.get('t'))}</td></tr>`;
  const note = ks.length > last.length ? `<div class="sub mt">Latest ${last.length} ${g === 'day' ? 'days' : g + 's'} shown. Narrow the period to see earlier ones.</div>` : '';
  return `<div class="mx-wrap"><table class="mx piv">${h}</tbody></table></div>${note}`;
}
function mxTable(X) {
  const D = S.data, dx = S.dx, under = dx.dir === 'u', word = under ? 'Under-billed' : 'Over-billed';
  if (!X.cells.size) return '<div class="empty">Nothing matches these filters.</div>';
  const cols = [...X.cols].sort((a, b) => (a[0] === 4) - (b[0] === 4) || Math.abs(b[1].v) - Math.abs(a[1].v)).map(([k]) => k);
  const rows = [...X.rows].sort((a, b) => Math.abs(b[1].v) - Math.abs(a[1].v)).map(([k]) => k);
  let mx = 0;
  for (const g of X.cells.values()) mx = Math.max(mx, Math.abs(g.v));
  const rgb = under ? '255,68,5' : '8,138,178';
  const id = 't' + ++seq, tips = (TIPS[id] = []);
  const tip = (title, g) => { tips.push(`<div class="tt">${esc(title)}</div>${tipRow(under ? 'u' : 'o', word, money(g.v))}${tipRow('', 'Share', Math.round((g.v / X.tot.v) * 100) + '%')}${tipRow('', 'Shipments', cnt(g.n))}${tipRow('', 'Merchants', cnt(g.ms.size))}`); return `data-tip="${id}:${tips.length - 1}"`; };

const CHARGE_WORDS = [

  [/^Shipping Charge Correction.*/i, 'shipping charge correction'], [/^Ca Customs Hst$/i, 'Canadian HST'], [/^Customs Gst$/i, 'GST'], [/^Ca British Columbia Pst$/i, 'BC PST'],
  [/^Pst Quebec$/i, 'Quebec PST'], [/^Missing PLD Fee$/i, 'missing package data fee'], [/^Not Previously Billed.*/i, 'late billing'],
  [/^Characteristics modifier$/i, 'package characteristics fee'], [/^Unitemized Adjustment$/i, 'unitemized adjustment'], [/^\(no description\)$/i, 'no description'],

const cap = (t) => String(t).replace(/^./, (x) => x.toUpperCase());

const pctOf = (a, b) => (b ? Math.round((a / b) * 100) : 0);

function likelyCause(f, lv, rb) {
  if (f && +f.withw >= 5 && f.heavier / f.withw >= 0.5) return 'Labels understate the weight. Check the product and box weights the merchant uses, and re-bill the difference.';
  if (f && +f.withd >= 5 && f.bigger / f.withd >= 0.3) return 'The declared box is smaller than what ships. Update the box size for these SKUs and re-bill the difference.';
  if (Math.abs(rb) < Math.abs(lv) * 0.05) return 'The carrier charge was never passed on to the merchant. Re-bill it.';
  return '';
}

/* ----- Progress ----- */
function viewProgress() {
  const D = S.data, snaps = S.snapshots;
  const now = agg({ noFilters: true, allTime: true }).tot;
  const first = snaps[0];
  const acts = [...S.actions.entries()].map(([id, a]) => ({ id, m: D.M.idx.get(id), ...a }));
  const working = acts.filter((a) => a.status === 'working').length, fixed = acts.filter((a) => a.status === 'fixed').length;
  const deltaTxt = (nowV, thenV) => {
    if (thenV == null) return 'Tracking starts today';
    const d = Math.abs(nowV) - Math.abs(thenV);
    if (Math.abs(d) < 0.5) return `Flat since ${shortDate(first.date)}`;
    return `<span class="delta" style="color:${d < 0 ? 'var(--good)' : 'var(--under-ink)'}">${d < 0 ? 'Down' : 'Up'} ${money(d)}</span> since ${shortDate(first.date)}`;
  };
  let h = `<div class="grid ${S.view === 'both' ? 'kpis' : 'k3'}">
    ${S.show.u ? kpi('Open under-billed', 'u', money(now.u), deltaTxt(now.u, first?.u)) : ''}
    ${S.show.o ? kpi('Open over-billed', 'o', money(now.o), deltaTxt(now.o, first?.o)) : ''}
    ${kpi('Merchants in progress', 'k', cnt(working), 'Being worked by PA or SE')}
    ${kpi('Marked fixed', '', cnt(fixed), `${cnt(acts.filter((a) => a.status === 'fixed' && a.m != null && curU(a.m) < -1).length)} still show open under-billing`)}
  </div>`;
  // Plot each reading as the change in open balance since tracking started: a few thousand dollars
  // of progress would be invisible on a $0 to $700K scale.
  const xs = snaps.map((s) => shortDate(s.date));
  const du = snaps.map((s) => Math.abs(s.u) - Math.abs(first.u)), dov = snaps.map((s) => Math.abs(s.o) - Math.abs(first.o));
  const tips = snaps.map((s, i) => `<div class="tt">${esc(shortDate(s.date))}</div>${tipRow('u', 'Under-billed open', money(s.u))}${tipRow('', 'Change', money(du[i], true))}${tipRow('o', 'Over-billed open', money(s.o))}${tipRow('', 'Change', money(dov[i], true))}`);
  h += `<div class="card mt"><div class="card-h"><div><h2>Change since tracking started</h2><div class="sub">Open balance vs ${esc(shortDate(first?.date || denverToday()))}, one reading per day, all merchants. Below zero means issues are getting fixed.</div></div>
    ${legendUO()}</div>
    ${snaps.length >= 2 ? slot('v-trend', 240, (w, hh) => compareChart(xs, [S.show.u && { name: 'Under-billed', color: 'var(--under)', ys: du }, S.show.o && { name: 'Over-billed', color: 'var(--over)', ys: dov }].filter(Boolean), w, hh, tips, true))
      : `<div class="empty">Tracking started ${esc(shortDate(first?.date || denverToday()))}. A reading is saved each day the page loads fresh data, so the trend fills in from here.</div>`}</div>`;
  const ag = agg({ by: 'age' });
  const ageItems = [0, 1, 2, 3, 4].filter((k) => ag.groups.has(k)).map((k) => { const g = ag.groups.get(k); return { key: k, name: AGES[k], u: g.u, o: g.o, right: cnt(g.un + g.on) }; });
  const rows = acts.filter((a) => a.m != null).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  h += `<div class="grid half mt"><div class="card"><div class="card-h"><div><h2>How old open issues are</h2><div class="sub">Age since each issue last changed. Uses your filters.</div></div>${legendUO()}</div>${drows(ageItems, {})}</div>
    <div class="card"><div class="card-h"><div><h2>Fix tracker</h2><div class="sub">Set status from any merchant's detail view.</div></div></div>
    ${rows.length ? `<div class="scroll"><table class="t"><thead><tr><th>Merchant</th><th>Status</th><th class="n">Open now</th><th>Updated</th></tr></thead><tbody>
    ${rows.map((a) => { const u = curU(a.m); return `<tr class="click" data-act="merchant" data-key="${a.m}"><td>${esc(D.M.name[a.m])}<small>${esc([a.owner, a.note].filter(Boolean).join(' · ').slice(0, 90))}</small></td><td>${statusPill(a.id)}</td><td class="n">${u < -0.01 ? `<span class="pill u">${money(u)}</span>` : '<span class="pill ok">Clear</span>'}</td><td>${esc((a.updatedAt || '').slice(0, 10))}<small>${esc(a.updatedBy || '')}</small></td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty">No merchants tracked yet. Open a merchant and set a status.</div>'}</div></div>`;
  return h;
}

/* ----- Merchant drawer ----- */
function classify(r) {
  const v = +r.v, md = +r.billed - +r.ec, xd = +r.chg - md, xu = +r.x_unq;
  if (!+r.joined) return 4;
  if (v < 0) { if (+r.charges_n === 0 && +r.ec > 0) return 1; if (xd < -0.01 && xd <= md) return xu <= xd / 2 ? 9 : 2; if (md < -0.01) return 3; return 4; }
  if (xd > 0.01 && xd > md) return 5;
  if (md > 0.01) return 6;
  return 4;
}

function closePop() { S.pop = null; $('#pop').classList.remove('on'); }
function renderPopOpts() {
  if (!S.pop) return;

  const a = agg({ by: dim, excl: dim });
  let items = [...a.groups].map(([k, g]) => ({ k, name: dimName(dim, k), u: g.u, o: g.o }));

/* ---------------- CSV ---------------- */
function download(name, rows) {

  else if (ds.top) { const [d, i] = ds.top.split(':'); openTopLine(d, +i); }
  else if (ds.line) { const D = S.data; openLine({ comp: ds.line, name: ds.lname || compName(ds.line), group: COMP_GROUP[ds.line[0]] || 'Line item', dir: dx.dir, sc: scopeSql(), carrier: dx.carrier != null ? D.carriers[dx.carrier] : null, type: dx.type != null ? TYPE_BY[dx.type]?.name : null }); }
  else if (ds.ltab && S.drawer?.kind === 'line') { S.drawer.ltab = ds.ltab; renderDrawer(true); }
  else if (ds.export === 'line') exportLine();
  else if (ds.okind) { S.ownerKind = ds.okind; renderView(); }
  else if ('close' in ds || el.id === 'scrim') closeDrawer();
  else if (ds.status && S.drawer) { S.drawer.form.status = ds.status; document.querySelectorAll('[data-status]').forEach((b) => b.classList.toggle('on', b.dataset.status === ds.status)); }
  else if ('save' in ds) saveFix();
  else if ('retry' in ds) { S.error = null; renderView(); refresh(); }
  else if (el.id === 'refresh') refresh();
  else if (ds.export === 'recon') download(`label-revenue-vs-monthly-report-${S.grain}.csv`, [['period', 'monthly_report', 'label_view', 'gap', 'gap_pct', 'labels'], ...reconRows().map((r) => [r.long, r.mr.toFixed(2), r.lbl.toFixed(2), r.gap.toFixed(2), r.pct == null ? '' : (r.pct * 100).toFixed(2), r.labels])]);
  else if (ds.export === 'ships' && S.drawer) {
    const D = S.data, name = D.M.name[S.drawer.m];
    download(`${name.replace(/[^A-Za-z0-9]+/g, '-').toLowerCase()}-shipments.csv`, [['fulfillment_group', 'tracking', 'carrier', 'labels', 'bought', 'issue_date', 'issue_type', 'gap', 'merchant_billed', 'merchant_expected', 'carrier_cost', 'carrier_quote'],
      ...S.drawer.ships.map((r) => { const md = +r.billed - +r.ec, xd = +r.chg - md; return [r.fg, r.trk, r.car, r.trks, r.bought, r.issued, TYPE_BY[classify(r)]?.name, (+r.v).toFixed(2), (+r.billed).toFixed(2), (+r.ec).toFixed(2), (+r.ecc - xd).toFixed(2), (+r.ecc).toFixed(2)]; })]);
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-popq]') && S.pop) { S.pop.q = e.target.value.trim().toLowerCase(); renderPopOpts(); }
  else if (e.target.dataset.form && S.drawer?.form) S.drawer.form[e.target.dataset.form] = e.target.value;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.pop) closePop(); else if (S.drawer) closeDrawer(); } });
const tip = $('#tip');
function hideTip() { tip.classList.remove('on'); }
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) return hideTip();
  const [id, i] = t.dataset.tip.split(':'), html = TIPS[id]?.[+i];
  if (!html) return hideTip();
  if (tip.dataset.k !== t.dataset.tip) { tip.innerHTML = html; tip.dataset.k = t.dataset.tip; }
  tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 16, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 16;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawSlots(); }, 150); });
setInterval(() => { renderFresh(); if (S.data && !S.loading && Date.now() - S.data.fetchedAt > STALE_MS && document.visibilityState === 'visible') refresh(); }, 60000);

/* Brand fonts: assets/fonts.css ships with git deploys and Google Fonts is linked as a second source.
   If neither loaded Instrument Serif, pull the same fonts.css from the data store. */
async function ensureFonts() {
  try {
    await document.fonts.ready;
    await new Promise((r) => setTimeout(r, 2500));
    if ([...document.fonts].some((f) => f.family.replace(/["']/g, '') === 'Instrument Serif' && f.status === 'loaded')) return;
    const css = await withStore((h) => h.files.text('assets/fonts.css'));
    if (css && css.includes('@font-face')) { const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st); }
  } catch {}
}

/* ---------------- boot ---------------- */
(async function boot() {
  render();
  try { await initSdk(); }
  catch (e) { S.error = 'This page needs the Fridge runtime. Open it from its fridge.redo.builders address. (' + msg(e) + ')'; renderView(); renderFresh(); return; }
  loadSide();
  ensureFonts();
  let raw = readLocal();
  const remote = await readRemote();
  if (remote && (!raw || remote.fetchedAt > raw.fetchedAt)) raw = remote;
  if (raw) setRaw(raw, 'cache');
  if (!raw || Date.now() - raw.fetchedAt > STALE_MS) await refresh();
})();
</script>
